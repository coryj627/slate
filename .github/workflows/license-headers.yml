# License-header guard.
#
# Fails any PR that introduces a tracked .rs or .swift file without an
# `SPDX-License-Identifier` line in its first 20 lines. The fixer is
# `scripts/apply-license-header.py` — idempotent, safe to re-run. See
# issue #266 for the rationale and the chosen header format.

name: License headers

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/*.swift'
      - '**/*.cs'
      - 'scripts/check-license-headers.sh'
      - 'scripts/apply-license-header.py'
      - '.github/workflows/license-headers.yml'
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/*.swift'
      - '**/*.cs'
      - 'scripts/check-license-headers.sh'
      - 'scripts/apply-license-header.py'
      - '.github/workflows/license-headers.yml'

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run; main never cancels.
# #1565: GitHub keeps one pending run per group, and a third run cancels
# the pending one, so a push to main could drop the run of the commit
# before it. Pull requests still group by branch and cancel superseded
# pushes; a push or dispatch groups by its commit, so no main run ever
# waits behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: SPDX header present on every .rs/.swift
    # No native toolchain or paid cache needed: bash + grep + git suffice.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run check
        run: ./scripts/check-license-headers.sh
