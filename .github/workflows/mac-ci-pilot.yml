# Scratch-branch diagnostic only; never a full inventory or human acceptance gate.
name: Mac CI pilot
run-name: Finder single-case diagnostic / ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-finder-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 704ab907e0df753dd24c0c6af688dc3a8975e4e7
  CANDIDATE: namespace-goldengate6x14
  PAIR_ID: finder-diag-${{ github.run_id }}

jobs:
  finder:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mac-finder-goldengate-diagnostic'
    # Existing exact shape; no custom tag, cache suffix, volume, or profile change.
    runs-on: nscloud-macos-goldengate-arm64-6x14
    timeout-minutes: 15
    steps:
      - name: Checkout branch harness with ancestry
        timeout-minutes: 2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: pilot-harness
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned harness Python
        timeout-minutes: 2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Checkout frozen repaired application
        timeout-minutes: 2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: One existing native case, bounded observations, distinct direct probe
        timeout-minutes: 10
        run: |
          exec python pilot-harness/scripts/mac-finder-diagnostic.py \
            --source "$GITHUB_WORKSPACE/source" \
            --evidence "$RUNNER_TEMP/mac-finder-diagnostic"
      - name: Preserve outcome and cancellation evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mac-finder-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: '${{ runner.temp }}/mac-finder-diagnostic/*'
          if-no-files-found: error
          retention-days: 14
