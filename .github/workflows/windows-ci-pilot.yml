# PRIVATE new full-app scope:45m job/40m step/40m wrapper; native/product/watchdog limits unchanged.
# PRIVATE proposal for a future isolated scratch branch only.
# Replace the registered filename .github/workflows/windows-ci-pilot.yml there.
name: Citation fixture full app qualification

'on':
  workflow_dispatch:
    inputs:
      build_mode:
        description: Original projects with exact support staging only; no fallback.
        required: true
        type: choice
        default: staged-projects
        options: [staged-projects]

permissions:
  contents: read
  actions: read

concurrency:
  group: citation-deferred-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  citation-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/windows-citation-deferred-diagnostic' }}
    name: Original controls, candidate pairs, complete app reference and guard mutant
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed diagnostic harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: harness
          persist-credentials: false
      - name: Checkout frozen original source98
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: '98c73f45ac2b81518ce652a0f6612bd3ef83c5e1'
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned effective original SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Set up Python for bounded diagnostic and strict evidence parser
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Hash fixed payload, preserve controls and require complete candidate app suite before mutant
        timeout-minutes: 40
        env:
          GH_TOKEN: '${{ github.token }}'
          BUILD_MODE: '${{ inputs.build_mode }}'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          python harness/scripts/windows-citation-deferred-diagnostic.py `
            --source "$env:GITHUB_WORKSPACE/source" `
            --evidence "$env:RUNNER_TEMP/citation-full-app-evidence" `
            --patch "$env:GITHUB_WORKSPACE/harness/scripts/diagnostics/citation-deferred-summary-pumped.patch" `
            --build-mode $env:BUILD_MODE `
            --app-reference "$env:GITHUB_WORKSPACE/harness/scripts/diagnostics/citation-app-reference-98.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve failures, exact C# mutations, assembly identities, and retained controls
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: citation-candidate-full-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: '${{ runner.temp }}/citation-full-app-evidence'
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
