# PRIVATE review proposal: no publication or dispatch by this agent.
# Future scratch branch uses the existing registered workflow filename only.
name: GRAPH-ONLY actual failed payload durability diagnostic

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: graph-durability-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  graph-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/windows-graph-durability-diagnostic' }}
    name: GRAPH-ONLY one original and one instrumented observation
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed self-contained diagnostic harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: harness
          persist-credentials: false
      - name: Checkout actual failed source5f
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: '5f29ebc72fc4a308e714f971ba73e3558e25552f'
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact observed original SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Set up pinned harness Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify actual failed archive, run control, compile only shell diagnostics and retain replay
        timeout-minutes: 15
        env:
          GH_TOKEN: '${{ github.token }}'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          python harness/scripts/windows-graph-durability-diagnostic.py `
            --source "$env:GITHUB_WORKSPACE/source" `
            --evidence "$env:RUNNER_TEMP/graph-durability-evidence" `
            --patch "$env:GITHUB_WORKSPACE/harness/scripts/diagnostics/graph-inspector-failure-diagnostics.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve raw outcomes, absent-scan status and exact source/assembly/manifest identities
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graph-durability-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: '${{ runner.temp }}/graph-durability-evidence'
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
