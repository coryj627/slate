# MODEL-ONLY diagnostic on codex/windows-model-4x8-diagnostic.
# Existing registered windows-ci-pilot.yml filename reused for manual discovery.
# Neither this workflow nor its checks certify a fresh complete native pipeline.
name: MODEL-ONLY Namespace4x8 diagnostic

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: namespace-4x8-model-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCER_REVISION: '98c73f45ac2b81518ce652a0f6612bd3ef83c5e1'
  EXPECTED_TREE: 'ae7f9507253ed87552e357dd1a373210b04bff72'
  PRODUCER_RUN: '37138568771'
  PRODUCER_ATTEMPT: '1'
  PRODUCER_CANDIDATE: 'namespace-8x16'
  PRODUCER_ARTIFACT_ID: '11280550921'
  PRODUCER_ARTIFACT_NAME: 'windows-pilot-binaries-37138568771-1'
  EXPECTED_MANIFEST: '93a097242cb3dc0383c8db245411054189e9c7cc2571e88be8f7e420ad67b9dd'
  EXPECTED_NATIVE: '8a0b43d62d760aabe6f37b216afb517b0f6c06b13ad047ac1e7a0be8f5ceb133'

jobs:
  immutable-producer-preflight:
    name: Confirm immutable prior successful producer before allocating consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read fixed run and artifact metadata with actions-read authorization
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request
          from pathlib import Path
          if (os.environ.get("GITHUB_REPOSITORY") != "coryj627/slate" or os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch" or os.environ.get("GITHUB_REF") != "refs/heads/codex/windows-model-4x8-diagnostic"):
              raise SystemExit("This MODEL-ONLY diagnostic runs only by manual dispatch on the fixed scratch branch.")
          base = "https://api.github.com/repos/coryj627/slate"
          def get(route):
              req = urllib.request.Request(base + route, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          run = get("/actions/runs/37138568771/attempts/1")
          artifact = get("/actions/artifacts/11280550921")
          if any(run.get(k) != v for k, v in {"id": 37138568771, "run_attempt": 1, "head_sha": os.environ["PRODUCER_REVISION"], "status": "completed", "conclusion": "success"}.items()):
              raise SystemExit("The original successful producer run/attempt is not confirmed.")
          if any(artifact.get(k) != v for k, v in {"id": 11280550921, "name": "windows-pilot-binaries-37138568771-1", "expired": False, "digest": "sha256:6f1cd53f75d980e25f0629638867c839b01fbae740c58952e8b4ce3c80257f90"}.items()):
              raise SystemExit("The immutable binary artifact is missing, expired or changed.")
          origin = artifact.get("workflow_run", {})
          if origin.get("id") != 37138568771 or origin.get("head_sha") != os.environ["PRODUCER_REVISION"] or origin.get("repository_id") != 1241111067:
              raise SystemExit("Wrong artifact repository/run/source.")
          expires = datetime.datetime.fromisoformat(artifact["expires_at"].replace("Z", "+00:00"))
          if expires <= datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=2):
              raise SystemExit("Less than two hours of artifact retention remain; do not allocate consumers.")
          Path("producer-preflight.txt").write_text(json.dumps({"run": run, "artifact": artifact, "newExecutionRunId": os.environ["GITHUB_RUN_ID"], "harnessRevision": os.environ["GITHUB_SHA"], "scope": "MODEL-ONLY diagnostic; no fresh app/shell/native certificate"}, indent=2))
          PY
      - name: Preserve original producer and new execution identities
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: common-model-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: producer-preflight.txt
          if-no-files-found: warn
          retention-days: 14

  model-shard:
    name: MODEL-ONLY (${{ matrix.candidate }}, shard ${{ matrix.shard }})
    needs: [immutable-producer-preflight]
    runs-on: nscloud-windows-2022-amd64-4x8
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: [namespace-4x8]
        shard: [0, 1]
    defaults:
      run:
        shell: pwsh
    env:
      EXECUTION_CANDIDATE: '${{ matrix.candidate }}'
      MODEL_SHARD_INDEX: '${{ matrix.shard }}'
    steps:
      - name: Checkout the immutable producer source for fixtures and drift twins
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: '98c73f45ac2b81518ce652a0f6612bd3ef83c5e1'
          fetch-depth: 0
      - name: Set up exactly the previously observed SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Download exact prior producer payload into the original source layout
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: windows-pilot-binaries-37138568771-1
          run-id: 37138568771
          repository: coryj627/slate
          github-token: '${{ github.token }}'
          path: apps/slate-windows
      - name: Independently verify all 449 files against original source/run/attempt
        run: |
          $binaryRoot = Join-Path $env:GITHUB_WORKSPACE 'apps\slate-windows'
          $manifestPath = Join-Path $binaryRoot 'pilot-binaries-manifest.json'
          $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestHash -ne $env:EXPECTED_MANIFEST) { throw 'Binary manifest hash mismatch.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:PRODUCER_REVISION -or $revision -ne $manifest.revision) { throw 'Consumer/producer/source SHA mismatch.' }
          if ($manifest.schemaVersion -ne 1 -or $manifest.runId -ne $env:PRODUCER_RUN -or $manifest.producerAttempt -ne $env:PRODUCER_ATTEMPT -or $manifest.relativeRoot -ne 'apps/slate-windows' -or $manifest.candidate -ne $env:PRODUCER_CANDIDATE) { throw 'Wrong run/attempt/candidate binary artifact.' }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Windows x64 required.' }
          if ($manifest.nativeSha256 -ne $env:EXPECTED_NATIVE) { throw 'Native digest differs from producer output.' }
          if (@($manifest.files).Count -ne 449) { throw 'Expected the original 449 transferred files.' }
          $paths = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($entry in $manifest.files) {
            if ([IO.Path]::IsPathRooted($entry.path) -or $entry.path.Split('/') -contains '..' -or -not $paths.Add($entry.path)) { throw 'Invalid or duplicate manifest path.' }
            $filePath = Join-Path $binaryRoot $entry.path
            $file = Get-Item -LiteralPath $filePath -ErrorAction Stop
            if ($file.PSIsContainer -or $file.Length -ne $entry.bytes -or (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) { throw "Binary mismatch: $($entry.path)" }
          }
          foreach ($required in $manifest.requiredFiles) {
            if (-not $paths.Contains($required)) { throw "Required binary lacks a hash: $required" }
          }
          $actualPaths = @()
          foreach ($relativeRoot in @(
            'src/SlateWindows/bin/Release',
            'tests/SlateWindows.Tests/bin/Release',
            'tests/SlateWindows.AccessibilityTests/bin/Release',
            'tools/GridConformanceHost/bin/Release'
          )) {
            $outputRoot = Join-Path $binaryRoot $relativeRoot
            foreach ($file in Get-ChildItem -LiteralPath $outputRoot -File -Recurse -Force) {
              $actualPaths += [IO.Path]::GetRelativePath($binaryRoot, $file.FullName).Replace('\', '/')
            }
          }
          if (-not $paths.SetEquals([string[]]$actualPaths)) { throw 'Downloaded outputs contain missing or unrecorded files.' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -ne $env:EXPECTED_TREE) { throw 'Source tree differs from the fixed original source.' }
          $expectedCpu = 4
          if ([Environment]::ProcessorCount -ne $expectedCpu) { throw 'Consumer CPU topology changed.' }
          $system = Get-CimInstance Win32_ComputerSystem
          $windows = Get-CimInstance Win32_OperatingSystem
          $cpu = @(Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors)
          $version = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $physicalMemoryBytes = [long]$system.TotalPhysicalMemory
          if ([Environment]::OSVersion.Version.Build -ne 20348 -or $windows.BuildNumber -ne '20348') { throw 'Windows Server2022 build20348 required.' }
          if ($physicalMemoryBytes -lt 6GB -or $physicalMemoryBytes -gt 10GB) { throw "Nominal8GB allocation required; actual bytes=$physicalMemoryBytes." }
          $sdk = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $sdk -ne '10.0.401') { throw 'The effective SDK must be 10.0.401.' }
          $runtimes = @(dotnet --list-runtimes)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect installed runtimes.' }
          $effective = @{}
          foreach ($name in @('Microsoft.NETCore.App', 'Microsoft.WindowsDesktop.App')) {
            $versions = @($runtimes | ForEach-Object {
              $m = [regex]::Match($_, ('^' + [regex]::Escape($name) + '\s+(10\.0\.[0-9]+)\s'))
              if ($m.Success) { [Version]$m.Groups[1].Value }
            } | Sort-Object -Descending)
            if ($versions.Count -eq 0 -or $versions[0].ToString() -ne '10.0.12') { throw "Latest installed .NET 10 patch differs for $name." }
            $effective[$name] = $versions[0].ToString()
          }
          if ($env:DOTNET_ROLL_FORWARD -and $env:DOTNET_ROLL_FORWARD -ne 'Minor') { throw 'Unexpected runtime roll-forward override.' }
          $coverageRoot = Join-Path $env:RUNNER_TEMP 'windows-pilot\model-coverage'
          $diagnosticsRoot = Join-Path $env:RUNNER_TEMP 'windows-pilot\model-diagnostics'
          New-Item -ItemType Directory -Force $coverageRoot, $diagnosticsRoot | Out-Null
          [ordered]@{
            schemaVersion = 2
            modelOnlyDiagnostic = $true
            sourceRevision = $revision
            sourceTree = $tree
            producerRevision = $manifest.revision
            producerRunId = $manifest.runId
            producerAttempt = $manifest.producerAttempt
            producerCandidate = $manifest.candidate
            artifactId = $env:PRODUCER_ARTIFACT_ID
            artifactName = $env:PRODUCER_ARTIFACT_NAME
            executionRunId = $env:GITHUB_RUN_ID
            executionAttempt = $env:GITHUB_RUN_ATTEMPT
            executionCandidate = $env:EXECUTION_CANDIDATE
            harnessRevision = $env:GITHUB_SHA
            manifestSha256 = $manifestHash
            nativeSha256 = $manifest.nativeSha256
            verifiedPayloadFiles = @($manifest.files).Count
            shardIndex = [int]$env:MODEL_SHARD_INDEX
            shardCount = 2
            logicalProcessors = [Environment]::ProcessorCount
            physicalMemoryBytes = $physicalMemoryBytes
            nominalShape = '4x8'
            windowsBuild = [int]$windows.BuildNumber
            windowsUbr = [int]$version.UBR
            windowsVersion = $windows.Version
            windowsCaption = $windows.Caption
            processorMetadata = $cpu
            matchingQualification = 'Namespace RAM-shape control: nominal4CPU/8GiB and Server2022 build20348. Prior4x16 allocation time, image patch, hardware, storage and hypervisor are not claimed identical.'
            os = [Environment]::OSVersion.VersionString
            gcAvailableMemoryBytes = [GC]::GetGCMemoryInfo().TotalAvailableMemoryBytes
            sdk = $sdk
            netCoreRuntime = $effective['Microsoft.NETCore.App']
            windowsDesktopRuntime = $effective['Microsoft.WindowsDesktop.App']
            rollForwardOverride = $env:DOTNET_ROLL_FORWARD
          } | ConvertTo-Json | Set-Content -Encoding utf8 "$coverageRoot\consumer-provenance.txt"
          dotnet --info | Set-Content "$diagnosticsRoot\dotnet-info.txt"
          Copy-Item -LiteralPath $manifestPath -Destination "$diagnosticsRoot\pilot-binaries-manifest.json"
      - name: Execute unchanged three-fact DLL command over the complete partition
        # No builds, project invocation, timer/scheduler changes, profiler or subset.
        run: >-
          dotnet test
          apps/slate-windows/tests/SlateWindows.Tests/bin/Release/net10.0-windows/SlateWindows.Tests.dll
          --filter "FullyQualifiedName~ConnectionsLeafTests.TheModelOf"
          --logger "trx;LogFileName=model.trx"
          --results-directory "${{ runner.temp }}\windows-pilot\model-diagnostics"
          --blame-hang-timeout 45m --blame-hang-dump-type mini
        env:
          SLATE_MODEL_SHARD_INDEX: '${{ matrix.shard }}'
          SLATE_MODEL_SHARD_COUNT: '2'
          SLATE_MODEL_REPORT_DIR: '${{ runner.temp }}\windows-pilot\model-coverage'
          SLATE_MODEL_ONLY: ''
      - name: Preserve canonical coverage, TRX, final progress and immutable provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: common-model-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.candidate }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}\windows-pilot\model-diagnostics\**\*
            ${{ runner.temp }}\windows-pilot\model-coverage\**\*
          if-no-files-found: error
          retention-days: 14

  per-provider-model-union:
    name: MODEL-ONLY full inventory (${{ matrix.candidate }})
    needs: [immutable-producer-preflight, model-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        candidate: [namespace-4x8]
    env:
      EXECUTION_CANDIDATE: '${{ matrix.candidate }}'
    steps:
      - name: Checkout the original reference inventory verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: '98c73f45ac2b81518ce652a0f6612bd3ef83c5e1'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download this new execution attempt's two provider report sets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: common-model-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.candidate }}-*
          path: '${{ runner.temp }}/common-payload/model-reports'
      - name: Verify immutable producer plus new execution and all 13069 scenarios
        env:
          REPORTS_ROOT: '${{ runner.temp }}/common-payload/model-reports'
        run: |
          python - <<'PY'
          """MODEL-ONLY common-payload aggregate; original full gates remain separate."""
          import argparse
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          PRODUCER = {
              "producerRevision": "98c73f45ac2b81518ce652a0f6612bd3ef83c5e1",
              "producerRunId": "37138568771",
              "producerAttempt": "1",
              "producerCandidate": "namespace-8x16",
              "artifactId": "11280550921",
              "artifactName": "windows-pilot-binaries-37138568771-1",
              "manifestSha256": "93a097242cb3dc0383c8db245411054189e9c7cc2571e88be8f7e420ad67b9dd",
              "nativeSha256": "8a0b43d62d760aabe6f37b216afb517b0f6c06b13ad047ac1e7a0be8f5ceb133",
              "sourceTree": "ae7f9507253ed87552e357dd1a373210b04bff72",
              "verifiedPayloadFiles": 449,
          }
          DIGESTS = {
              "routes": "e847440e2e4a1c18142b44faa91f8891209b2866296ea15fd31a5385657737fd",
              "reroot": "48c2daa03565b2e82a202e211d44b32555ef92d1b28a793fc4561a8b5912312e",
              "composed": "81ba0fdae0e51f8c33e110ea0d3ccd8278157f2f390560fdba268712472a629a",
          }
          FACTS = {
              "SlateWindows.Tests.ConnectionsLeafTests.TheModelOfRuleDDerivesEveryComposedRouteAcrossEveryMode",
              "SlateWindows.Tests.ConnectionsLeafTests.TheModelOfRuleDDerivesEveryReRootAndBackAcrossEveryState",
              "SlateWindows.Tests.ConnectionsLeafTests.TheModelOfTermsTwoToNineDerivesEveryRoutesTimelineAcrossEveryState",
          }
          NS = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          BAD_COUNTERS = ("failed", "error", "timeout", "aborted", "inconclusive", "passedButRunAborted", "notRunnable", "notExecuted", "disconnected", "warning", "inProgress", "pending")


          def require(condition, message):
              if not condition:
                  raise ValueError(message)


          def verify(root, source_root, execution_run, execution_attempt, harness_revision, candidate):
              require(execution_run.isdecimal() and int(execution_run) > 0, "Invalid new execution run.")
              require(execution_run != PRODUCER["producerRunId"], "Supplemental execution must have a distinct run ID.")
              require(execution_attempt.isdecimal() and int(execution_attempt) > 0, "Invalid new execution attempt.")
              require(candidate in ("namespace-4x8",), "Unknown consumer provider.")
              import re
              require(re.fullmatch(r"[0-9a-f]{40}", harness_revision) is not None, "Invalid harness SHA.")
              records = sorted(root.rglob("consumer-provenance.txt"))
              require(len(records) == 2, "Expected exactly two provenance records for this provider.")
              require(len(list(root.rglob("model.trx"))) == 2, "Expected exactly two TRX files.")
              require(len(list(root.rglob("pilot-binaries-manifest.json"))) == 2, "Expected exactly two copied manifests.")
              # Exactly six canonical reports, not a mixed-provider directory or diagnostic duplicates.
              reports = []
              seen = set()
              for p in records:
                  v = json.loads(p.read_text(encoding="utf-8-sig"))
                  expected = dict(PRODUCER, schemaVersion=2,
                                  sourceRevision=PRODUCER["producerRevision"],
                                  executionRunId=execution_run, executionAttempt=execution_attempt,
                                  harnessRevision=harness_revision, executionCandidate=candidate,
                                  shardCount=2, modelOnlyDiagnostic=True)
                  require(all(v.get(k) == e for k, e in expected.items()), f"Source/producer/execution mismatch: {p}")
                  index = v.get("shardIndex")
                  require(type(index) is int and index in (0, 1) and index not in seen, "Invalid or duplicate shard.")
                  seen.add(index)
                  require(type(v.get("verifiedPayloadFiles")) is int, "Payload count must be an integer.")
                  cpu = v.get("logicalProcessors")
                  require(type(cpu) is int and cpu == 4, "Provider CPU topology changed.")
                  require(v.get("nominalShape") == "4x8", "Nominal shape changed.")
                  memory = v.get("physicalMemoryBytes")
                  require(type(memory) is int and 6*1024**3 <= memory <= 10*1024**3, "Nominal8GB physical-memory witness missing/changed.")
                  require(type(v.get("windowsBuild")) is int and v["windowsBuild"] == 20348, "Server2022 build missing/changed.")
                  require(type(v.get("windowsUbr")) is int and v["windowsUbr"] >= 0, "Image patch witness missing.")
                  require(type(v.get("processorMetadata")) is list and bool(v["processorMetadata"]), "Processor metadata missing.")
                  require(v.get("sdk") == "10.0.401" and v.get("netCoreRuntime") == "10.0.12" and v.get("windowsDesktopRuntime") == "10.0.12", "Observable effective toolchain changed.")
                  artifact_root = p.parent.parent
                  manifests = list(artifact_root.rglob("pilot-binaries-manifest.json"))
                  require(len(manifests) == 1, "Missing/duplicate manifest per shard.")
                  require(hashlib.sha256(manifests[0].read_bytes()).hexdigest() == PRODUCER["manifestSha256"], "Copied manifest bytes differ.")
                  manifest = json.loads(manifests[0].read_text(encoding="utf-8-sig"))
                  for k, val in {"schemaVersion": 1, "revision": PRODUCER["producerRevision"], "runId": PRODUCER["producerRunId"], "producerAttempt": "1", "candidate": "namespace-8x16", "nativeSha256": PRODUCER["nativeSha256"], "relativeRoot": "apps/slate-windows"}.items():
                      require(manifest.get(k) == val, "Old producer manifest identity changed.")
                  require(len(manifest.get("files", [])) == 449, "Wrong original payload count.")
                  trx = list(artifact_root.rglob("model.trx"))
                  require(len(trx) == 1, "Missing/duplicate model TRX per shard.")
                  tr = ET.parse(trx[0]).getroot()
                  results = tr.findall(".//t:UnitTestResult", NS)
                  require(len(results) == 3 and {a.get("testName") for a in results} == FACTS and all(a.get("outcome") == "Passed" for a in results), "TRX must contain all three unique passed facts.")
                  counters = tr.findall(".//t:Counters", NS)
                  require(len(counters) == 1, "Missing/duplicate TRX counters.")
                  c = counters[0]
                  require(all(c.get(k) == "3" for k in ("total", "executed", "passed")) and all(c.get(k) == "0" for k in BAD_COUNTERS), "TRX has missing, failed, skipped or pending results.")
                  summaries = tr.findall(".//t:ResultSummary", NS)
                  require(len(summaries) == 1 and summaries[0].get("outcome") == "Completed", "TRX execution did not complete.")
                  files = sorted(p.parent.glob("*.json"))
                  require({a.name for a in files} == {f"{f}-shard-{index}.json" for f in DIGESTS}, "Expected exactly three canonical family reports per shard.")
                  for report_path in files:
                      r = json.loads(report_path.read_text(encoding="utf-8-sig"))
                      require(r.get("inventorySha256") == DIGESTS.get(r.get("family")), "Reference inventory digest changed.")
                      require(r.get("missedProgressWrites") == 0, "Missed progress writes; preserve and investigate.")
                      reports.append(report_path)
              require(seen == {0, 1}, "Missing full provider union.")
              require(len(list(root.rglob("*-shard-*.json"))) == 6, "Extra or duplicate coverage files.")
              path = source_root / "scripts/verify_windows_model_shards.py"
              spec = importlib.util.spec_from_file_location("reference_verifier", path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              summaries = module.verify(reports, 2)
              require(sum(s["cases"] for s in summaries) == 13069, "Reference total differs.")
              return {"candidate": candidate, "executionRunId": execution_run, "executionAttempt": execution_attempt,
                      "harnessRevision": harness_revision, "sourceRevision": PRODUCER["producerRevision"],
                      "producerRunId": PRODUCER["producerRunId"], "producerAttempt": "1", "cases": 13069,
                      "manifestSha256": PRODUCER["manifestSha256"], "nativeSha256": PRODUCER["nativeSha256"],
                      "modelOnlyDiagnostic": True, "families": summaries}


          import os
          value = verify(Path(os.environ["REPORTS_ROOT"]), Path.cwd(), os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"], os.environ["GITHUB_SHA"], os.environ["EXECUTION_CANDIDATE"])
          Path("model-only-result.txt").write_text(json.dumps(value, indent=2))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("MODEL-ONLY common-payload diagnostic: " + value["candidate"] + " passed all 13,069 scenarios exactly once. Original producer run 37138568771 / attempt 1; new execution run " + value["executionRunId"] + ". This is not a fresh native/app/shell pipeline certificate.\n")
          print(json.dumps(value, indent=2))
          PY
      - name: Retain per-provider model-only verification
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: common-model-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.candidate }}
          path: model-only-result.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Require every current trial job to succeed
        env:
          PREFLIGHT_RESULT: '${{ needs.immutable-producer-preflight.result }}'
          MODEL_RESULT: '${{ needs.model-shard.result }}'
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$MODEL_RESULT" = success

  model-only-diagnostic-aggregate:
    name: MODEL-ONLY Namespace4x8 aggregate (unchanged full inventory)
    needs: [immutable-producer-preflight, model-shard, per-provider-model-union]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete Namespace union and both current consumers
        env:
