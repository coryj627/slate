# Windows frontend CI (w0_spec §W0-2 item 3, #603): runs its jobs only for
# the paths in on.push.paths, so a Windows PR doesn't wait on mac checks
# and vice versa (the per-area pattern of a11y-check.yml / swift-tests.yml).
# On a pull request the changes job decides from that list, and the jobs
# report as skipped when it does not match (#1565). Parallel build/test
# lanes and required aggregation:
#
#   rust-tests — the deliberate platform witnesses (slate-core, slate-cli
#     suites: MoveFileExW no-clobber, reserved-name validation,
#     case-insensitive identity, long paths) plus the ARM64 cross-compile
#     check. Independent of the bindings→dotnet chain, so it runs beside
#     it instead of serially in front of it.
#   windows — release cdylib + C# bindings, app build, xUnit suite, the
#     `dotnet format` promise, and the FlaUI binaries handoff.
#   windows-model-shard — two independent jobs divide all 13,069
#     Connections model scenarios, retaining serial dispatcher execution
#     and fresh workspaces in each process. windows-model verifies their
#     complete, disjoint coverage and keeps the existing check name.
#   flaui — the FlaUI/axe-windows shell gate, on GITHUB-HOSTED
#     windows-latest: the 2026-07-31 spike run proved the Namespace
#     Windows session is NON-INTERACTIVE, and the W1-1 gate launches
#     the real WinExe and drives it through UIA3, which requires a
#     desktop (the suite's own guard failed loudly, by design). The
#     gate consumes the app lane's built binaries as an artifact — the
#     exe resolver walks RELATIVE from the test assembly
#     (ShellAccessibilityTests.SlateWindowsExe), so the artifact
#     preserves the apps/slate-windows bin layout, carries the root
#     global.json (the SDK pin), and needs no checkout. Revisit if
#     Namespace ships interactive Windows sessions (they ship RDP, so
#     a desktop plainly can exist).
#
# The historical check name "build + test (windows x64)" belongs to the
# `gate` aggregate job, which fails unless ALL FOUR lanes succeed — a
# branch rule (or a human) requiring the historical name still gates on
# the platform witnesses and the accessibility gate, exactly as the
# serial job did (adversarial review: GitHub evaluates required checks
# individually, not by sibling status).
#
# Runner selection, revised 2026-10-11: the repository variable
# WINDOWS_RUNNER_MODE and the routing job `route` decide per lane, from
# the state the home host publishes every tick in the repository variable
# WINDOWS_HOME_STATE (heartbeat, slots, what runs, what is queued).
# `home` means home first: a lane takes a free slot of the self-hosted
# pool on the owner's desktop (one throwaway Hyper-V VM per job, labels
# slate-win-{rust,app,model}); when none is free it queues there only if
# it would still finish inside the run's critical path (the app lane plus
# the shell gate), and otherwise runs on Namespace at once. A state whose
# `at` is more than 180 s (three minutes) before the routing job's own
# clock is stale; a stale state, or one that says the host is not
# serving, sends every lane to Namespace by itself. `home-only` queues
# every lane at home (golden-image validation, fidelity runs).
# `namespace` or anything else, including unset, is today's providers,
# verbatim, and the routing job does not run at all: a run that cannot
# read repository variables (a fork or Dependabot pull request) never
# waits on the home host. A fork
# pull request runs on today's providers in every mode, home-only
# included: the router applies its fork rule before the mode, the shell
# gate's runs-on carries the same rule, and the host refuses and evicts
# a fork's job even if its copy of the router or of this workflow says
# otherwise. A run of Dependabot's code, whoever started it (its PR, its
# branch, a re-run or an update by the owner), is treated the same way
# (plan 42 §3.7). The shell gate stays on GitHub-hosted windows-latest in
# every mode but home-only: free on a public repository and faster than
# the home pool.
# ci/windows-runner/route/route.py is the rule; its step summary shows
# what each run saw and decided, with a replay line. The gate's failure
# line prints route=<result> router-attempt='<attempt>' and the pools, but
# GitHub reports a continue-on-error job's result as it sees fit (it can
# read success for a routing job that failed): an empty router-attempt=''
# in that line is the sign the router produced nothing, and the lanes then
# took the vendor. A lane trusts the router's answer only in the attempt
# it ran in, so "Re-run failed jobs" (which reuses it) always lands on
# Namespace: after a flip or an outage use "Re-run all jobs"
# (`gh run rerun <id>`). The runbook
# docs/runbooks/self-hosted-windows-runner.md has the design, the
# fallback flip and the trust model; today's providers are the 2026-07-31
# arrangement: namespace-profile-winx64-fast[-pr] (dashboard-configured,
# Cache Volumes enabled) for the build/test lanes and windows-latest for
# the shell gate. Flip with `gh variable set WINDOWS_RUNNER_MODE --body
# namespace` (and back with `--body home`). The per-attempt actions/cache
# scheme both replaced is in git history at a5037b35.
#
# On `home` the cache is a per-lane VHDX forked copy-on-write for every
# job and merged back by the host ONLY after GitHub's record shows a
# green push/schedule/dispatch on main of this repository — labels
# carry no trust there either. The attestation/footprint steps below
# read NSC_CACHE_PATH on both pools (the guest exports it for the
# mounted cache volume).
#
# Cache: Namespace NVMe cache volumes — fork-on-mount, commit-on-clean-
# exit, last-write-wins (namespace.so/docs/architecture/storage/
# cache-volumes). The two lanes use SEPARATE volume lineages via
# overrides.cache-tag, for the same reason the actions/cache scheme kept
# two lineages: the lanes build disjoint target profile dirs (ci +
# aarch64 check vs release), and on a SHARED volume the longer app lane
# would always commit last, permanently discarding the rust lane's
# ci-profile artifacts (rust.yml's documented inversion, made permanent
# by the lane shapes here). A volume resets to EMPTY if content exceeds
# its dashboard-configured size — each lane ends with a footprint report;
# watch the trend and grow the volume before the cliff.
#
# Cache trust: runner selection remains ref-conditional, but custom tags
# share a volume across profiles/repositories. The main/-pr profile names
# alone do not isolate slate-windows-rust/app/model. Enforced persistence
# restrictions must cover every job/profile capable of attaching each tag.
# The earlier per-profile isolation claim is superseded by the current
# Namespace cache documentation (2026-09-22).
#
# See docs/runbooks/ci-cache-policy.md for the provider verification and
# drained transition. Workflow labels are routing, not a security boundary
# against PR-controlled YAML. Do not reset volumes or claim protection from
# these comments without verifying the effective provider policy.

name: windows

on:
  # Every pull request: the changes job decides from on.push.paths, the
  # lane's one path list, whether it touches the lane (#1565).
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/slate-windows/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      # The .NET SDK pin every dotnet in the lane reads (#1568).
      - 'global.json'
      - '.github/workflows/windows.yml'
      - 'ci/windows-runner/route/**'
      - 'scripts/verify_windows_model_shards.py'
      - 'scripts/tests/test_windows_model_shards.py'
      # W6-2 PR F (IPJ-5-1): the lane's censuses read the plan documents,
      # the generators read the scripts, the help catalog and the mac
      # sources — a change to any of them must run the lane. Only the plan
      # documents the censuses read are listed, top-level ones by name:
      # the ten contracts documents a check reads, the Windows port
      # folder, and one spec a ledger decision cites. Every other plan
      # document (the unread contracts, plans 43 and 44, any design or
      # planning folder) does not start the lane. scripts/
      # check_windows_docs_trigger.py fails the lane if a check reads a
      # docs path this list misses.
      - 'docs/plans/22_property_panel_contracts.md'
      - 'docs/plans/23_citation_surfaces_contracts.md'
      - 'docs/plans/25_bases_grid_contracts.md'
      - 'docs/plans/29_search_overlay_contracts.md'
      - 'docs/plans/34_canvas_contracts.md'
      - 'docs/plans/35_graph_contracts.md'
      - 'docs/plans/37_editor_peer_contracts.md'
      - 'docs/plans/38_notification_dispatcher_contracts.md'
      - 'docs/plans/39_at_navigation_contracts.md'
      - 'docs/plans/40_nvda_matrix_remediation_contracts.md'
      - 'docs/plans/18_windows_port/**'
      - 'docs/plans/15_files_sidebar/specs/fl4_spec.md'
      - 'docs/help/**'
      - 'scripts/**'
      - 'apps/slate-mac/**'
      # IPJ-6-1: the roll-up the §K census reads, and the corpus and
      # parity fixtures the censuses read.
      - 'BENCHMARKS.md'
      - 'tests/fixtures/**'
  workflow_dispatch:

# #1565: GitHub keeps one pending run per group, and a third run cancels
# the pending one, so a push to main could drop the run of the commit
# before it. Pull requests still group by branch and cancel superseded
# pushes; a push or dispatch groups by its commit, so no main run ever
# waits behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # #1565: does this pull request touch the lane? Each job below is skipped
  # when it does not (a skipped job reports as passed), and runs when the
  # decision failed (.github/workflows/lane-changes.yml).
  changes:
    name: changes
    uses: ./.github/workflows/lane-changes.yml
    permissions:
      contents: read
    with:
      workflow: .github/workflows/windows.yml

  # The rule lives in ci/windows-runner/route/route.py (spec §3–§5): it
  # reads the state the host publishes (vars) and decides a pool per lane.
  # It runs only when the mode is home or home-only and never fails the
  # run: the job and both steps continue on error (on the job, a timeout or
  # a lost runner cannot fail the run either; needs.route.result is then
  # whatever GitHub reports, so nothing depends on it), and every routed
  # lane falls back to the vendor when an output is missing or was written
  # by an earlier attempt.
  route:
    name: Route Windows lanes
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && (vars.WINDOWS_RUNNER_MODE == 'home' || vars.WINDOWS_RUNNER_MODE == 'home-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    outputs:
      attempt: ${{ steps.route.outputs.attempt }}
      rust-pool: ${{ steps.route.outputs.rust-pool }}
      app-pool: ${{ steps.route.outputs.app-pool }}
      model-0-pool: ${{ steps.route.outputs.model-0-pool }}
      model-1-pool: ${{ steps.route.outputs.model-1-pool }}
    steps:
      - name: Checkout the route script
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The router and the allow-list its bot rule reads (plan 42 §3.7).
          sparse-checkout: |
            /ci/windows-runner/route/
            /ci/mac-runner/allowlist.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Pick a pool for each lane from the mode and the host's published state
        id: route
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUNNER_MODE: ${{ vars.WINDOWS_RUNNER_MODE }}
          WINDOWS_HOME_STATE: ${{ vars.WINDOWS_HOME_STATE }}
          ROUTE_LANES: rust,app,model-0,model-1
          ROUTE_ATTEMPT: ${{ github.run_attempt }}
          ROUTE_RUN_ID: ${{ github.run_id }}
          ROUTE_EVENT: ${{ github.event_name }}
          ROUTE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ROUTE_REPO: ${{ github.repository }}
          ROUTE_ACTOR: ${{ github.actor }}
          ROUTE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ROUTE_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ROUTE_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          ROUTE_ALLOWLIST: ci/mac-runner/allowlist.json
        run: python3 ci/windows-runner/route/route.py

  rust-tests:
    name: rust tests (windows x64)
    needs: [changes, route]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ (needs.route.outputs.attempt == github.run_attempt && needs.route.outputs.rust-pool == 'home') && 'slate-win-rust' || format('namespace-profile-winx64-fast{0};overrides.cache-tag=slate-windows-rust', github.ref != 'refs/heads/main' && '-pr' || '') }}
    timeout-minutes: 60
    steps:
      - name: Record the runner
        env:
          ROUTER_ATTEMPT: ${{ needs.route.outputs.attempt }}
        run: Write-Host "runner=${{ runner.name }} environment=${{ runner.environment }} attempt=${{ github.run_attempt }} router-attempt=$env:ROUTER_ATTEMPT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Assert runner architecture matches the cache lineage
        # Twin of rust.yml's guard: the NVMe cache volume is keyed per
        # custom tag across profiles/repos, NOT per architecture. If the profile's
        # platform is ever re-pinned in the dashboard, arch-specific
        # rlibs would silently thrash the volume on every alternation.
        # Fail loudly instead; on a deliberate re-pin, update the
        # expected value here and expect one cold rebuild.
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            Write-Host "::error::runner arch is $($env:PROCESSOR_ARCHITECTURE), cache lineage expects AMD64 - profile platform changed in the dashboard? Update this guard and expect one cold rebuild."
            exit 1
          }

      # rust-toolchain.toml pins 1.99.1; rustup materializes it (plus the
      # x86_64-pc-windows-msvc host target) on the first cargo call.

      - name: Cache Rust build (Namespace NVMe cache)
        if: ${{ !(needs.route.outputs.attempt == github.run_attempt && needs.route.outputs.rust-pool == 'home') }}
        # `rust` mode mounts ~/.cargo/{registry,git,.global-cache} and
        # the cargo target dir onto the volume — no upload/download, no
        # save step, no exact-key freeze class (the 2026-07 incident the
        # actions/cache scheme was built to end). Checkout runs FIRST:
        # Windows mounts are NTFS junctions, which a later checkout
        # would clobber (the action's post step verifies survival).
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9  # v1.7.0
        with:
          cache: rust

      - name: Cache mount state (pre-build)
        # Bootstrap attestation (docs/runbooks/ci-cache-policy.md step 3): read BEFORE any build
        # repopulates the volume, so a cold mount is distinguishable
        # from a surviving stale generation. Measured at the VOLUME
        # ROOT (adversarial round 4: junction/symlink mount points make
        # per-directory sizing lie; NSC_CACHE_PATH holds the real
        # content for every cache mode).
        run: |
          $root = $env:NSC_CACHE_PATH
          if (-not $root) {
            Write-Host "::error::NSC_CACHE_PATH missing - cache volume not mounted"
            exit 1
          }
          try {
            # Fail CLOSED (adversarial rounds 7-8): SilentlyContinue let
            # a failed root enumeration print the cold sentinel and an
            # unreadable child render as 0.00 GiB (System Volume
            # Information, observed live); Get-ChildItem on a FILE path
            # succeeds and would attest a plausible 0.00 GiB, so the
            # root must resolve as a DIRECTORY first - a mount or access
            # failure must never masquerade as a cold attestation.
            $rootItem = Get-Item -LiteralPath $root -Force -ErrorAction Stop
          } catch {
            Write-Host "::error::cannot resolve cache volume root ${root}: $_"
            exit 1
          }
          if (-not $rootItem.PSIsContainer) {
            Write-Host "::error::cache volume root $root is not a directory - attestation impossible"
            exit 1
          }
          try {
            $children = @(Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop)
          } catch {
            Write-Host "::error::cannot enumerate cache volume root ${root}: $_"
            exit 1
          }
          $metadata = @('System Volume Information', '$RECYCLE.BIN', 'containerscache', 'gitmirror', 'lost+found')
          $children = @($children | Where-Object { $metadata -notcontains $_.Name })
          if ($children.Count -eq 0) { "cache volume empty (cold mount)" }
          foreach ($child in $children) {
            try {
              $bytes = (Get-ChildItem -LiteralPath $child.FullName -Recurse -Force -ErrorAction Stop |
                Measure-Object Length -Sum).Sum
              '{0,8:N2} GiB  {1}' -f ([double]$bytes / 1GB), $child.Name
            } catch {
              Write-Host "::warning::cannot measure $($child.Name) - measurement incomplete, NOT cold"
            }
          }

      - name: ARM64 cross-compile check (slate-uniffi)
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check -p slate-uniffi --target aarch64-pc-windows-msvc --locked

      # Windows is the load-bearing witness for MoveFileExW no-clobber,
      # reserved-name validation, case-insensitive identity, long paths, and
      # every other platform-sensitive core contract. Run the complete package
      # suite except the intentionally long randomized censuses and the
      # hardware-timing guard (both remain covered by the Rust lanes).
      #
      # `--profile ci` for the same reason rust.yml adopted it: the suite's
      # wall time was dominated by EXECUTING tests at opt-level 0 (~182s for
      # the lib binary here), not compiling them. The ci profile is opt-level
      # 2 with debug-assertions + overflow-checks still armed (Cargo.toml).
      - name: slate-core non-census test suite (ci profile)
        run: >-
          cargo test -p slate-core --profile ci --locked
          -- --skip census_
          --skip perf_guard_root_listing_under_100ms_on_10k_files
          --skip perf_guard_unresolved_link_rescan_within_twice_the_link_free_one

      # Program decision 19 / w0_spec §W0-3 item 3: the CLI builds and its
      # suite runs on the Windows runner — the full extent of Windows CLI
      # scope (distribution reserved as W-E5).
      - name: slate-cli test suite (ci profile)
        run: cargo test -p slate-cli --profile ci --locked

      # rust.yml's lint job runs this on Linux, where cfg(windows) code is
      # never compiled (#1570). The same invocation here lints what the
      # Windows build compiles; dev profile, as there. After the suites, so a
      # lint finding never hides the Windows test results.
      - name: clippy (windows x64, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cache footprint report
        # The volume resets to EMPTY past its configured size — keep the
        # trend visible from every lane that can commit (rust.yml's twin
        # reports). Runs on failure too: a red run commits nothing, but
        # the fork it measured is still the size the next run inherits.
        if: ${{ always() }}
        run: |
          $root = $env:NSC_CACHE_PATH
          if (-not $root) {
            Write-Host "::error::NSC_CACHE_PATH missing - cache volume not mounted"
            exit 1
          }
          try {
            # Fail CLOSED (adversarial rounds 7-8): SilentlyContinue let
            # a failed root enumeration print the cold sentinel and an
            # unreadable child render as 0.00 GiB (System Volume
            # Information, observed live); Get-ChildItem on a FILE path
            # succeeds and would attest a plausible 0.00 GiB, so the
            # root must resolve as a DIRECTORY first - a mount or access
            # failure must never masquerade as a cold attestation.
            $rootItem = Get-Item -LiteralPath $root -Force -ErrorAction Stop
          } catch {
            Write-Host "::error::cannot resolve cache volume root ${root}: $_"
            exit 1
          }
          if (-not $rootItem.PSIsContainer) {
            Write-Host "::error::cache volume root $root is not a directory - attestation impossible"
            exit 1
          }
          try {
            $children = @(Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop)
          } catch {
            Write-Host "::error::cannot enumerate cache volume root ${root}: $_"
            exit 1
          }
          $metadata = @('System Volume Information', '$RECYCLE.BIN', 'containerscache', 'gitmirror', 'lost+found')
          $children = @($children | Where-Object { $metadata -notcontains $_.Name })
          if ($children.Count -eq 0) { "cache volume empty (cold mount)" }
          foreach ($child in $children) {
            try {
              $bytes = (Get-ChildItem -LiteralPath $child.FullName -Recurse -Force -ErrorAction Stop |
                Measure-Object Length -Sum).Sum
              '{0,8:N2} GiB  {1}' -f ([double]$bytes / 1GB), $child.Name
            } catch {
              Write-Host "::warning::cannot measure $($child.Name) - measurement incomplete, NOT cold"
            }
          }

  windows:
    name: app build + test (windows x64)
    needs: [changes, route]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ (needs.route.outputs.attempt == github.run_attempt && needs.route.outputs.app-pool == 'home') && 'slate-win-app' || format('namespace-profile-winx64-fast{0};overrides.cache-tag=slate-windows-app', github.ref != 'refs/heads/main' && '-pr' || '') }}
    timeout-minutes: 60
    steps:
      - name: Record the runner
        env:
          ROUTER_ATTEMPT: ${{ needs.route.outputs.attempt }}
        run: Write-Host "runner=${{ runner.name }} environment=${{ runner.environment }} attempt=${{ github.run_attempt }} router-attempt=$env:ROUTER_ATTEMPT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The W6-1 reconciliation's ancestry gate (CanvasReconciliationCensus)
          # runs `git merge-base --is-ancestor` over the ledgered merge commits;
          # a depth-1 clone cannot answer it.
          fetch-depth: 0

      - name: Assert runner architecture matches the cache lineage
        # See the rust-tests twin for the rationale.
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            Write-Host "::error::runner arch is $($env:PROCESSOR_ARCHITECTURE), cache lineage expects AMD64 - profile platform changed in the dashboard? Update this guard and expect one cold rebuild."
            exit 1
          }

      # rust-toolchain.toml pins 1.99.1; rustup materializes it (plus the
      # x86_64-pc-windows-msvc host target) on the first cargo call.

      - name: Cache Rust build + NuGet packages (Namespace NVMe cache)
        if: ${{ !(needs.route.outputs.attempt == github.run_attempt && needs.route.outputs.app-pool == 'home') }}
        # `rust` mode as in the rust-tests lane (this lineage carries the
        # RELEASE graph the bindings build needs), plus the NuGet
        # global-packages folder as an explicit path — the action unions
        # `cache:` modes with `path:` entries (swift-tests.yml pattern;
        # spacectl has no nuget mode).
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9  # v1.7.0
        with:
          cache: rust
          path: |
            ~/.nuget/packages

      - name: Cache mount state (pre-build)
        # Bootstrap attestation (docs/runbooks/ci-cache-policy.md step 3): read BEFORE any build
        # repopulates the volume, so a cold mount is distinguishable
        # from a surviving stale generation. Measured at the VOLUME
        # ROOT (adversarial round 4: junction/symlink mount points make
        # per-directory sizing lie; NSC_CACHE_PATH holds the real
        # content for every cache mode).
        run: |
          $root = $env:NSC_CACHE_PATH
          if (-not $root) {
            Write-Host "::error::NSC_CACHE_PATH missing - cache volume not mounted"
            exit 1
          }
          try {
            # Fail CLOSED (adversarial rounds 7-8): SilentlyContinue let
            # a failed root enumeration print the cold sentinel and an
            # unreadable child render as 0.00 GiB (System Volume
            # Information, observed live); Get-ChildItem on a FILE path
            # succeeds and would attest a plausible 0.00 GiB, so the
            # root must resolve as a DIRECTORY first - a mount or access
            # failure must never masquerade as a cold attestation.
            $rootItem = Get-Item -LiteralPath $root -Force -ErrorAction Stop
          } catch {
            Write-Host "::error::cannot resolve cache volume root ${root}: $_"
            exit 1
          }
          if (-not $rootItem.PSIsContainer) {
            Write-Host "::error::cache volume root $root is not a directory - attestation impossible"
            exit 1
          }
          try {
            $children = @(Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop)
          } catch {
            Write-Host "::error::cannot enumerate cache volume root ${root}: $_"
            exit 1
          }
          $metadata = @('System Volume Information', '$RECYCLE.BIN', 'containerscache', 'gitmirror', 'lost+found')
          $children = @($children | Where-Object { $metadata -notcontains $_.Name })
          if ($children.Count -eq 0) { "cache volume empty (cold mount)" }
          foreach ($child in $children) {
            try {
              $bytes = (Get-ChildItem -LiteralPath $child.FullName -Recurse -Force -ErrorAction Stop |
                Measure-Object Length -Sum).Sum
              '{0,8:N2} GiB  {1}' -f ([double]$bytes / 1GB), $child.Name
            } catch {
              Write-Host "::warning::cannot measure $($child.Name) - measurement incomplete, NOT cold"
            }
          }

      - name: Read the pinned uniffi-bindgen-cs tag
        id: bindgen-pin
        # apps/slate-windows/uniffi-bindgen-cs.version is the repository's one
        # copy, shared with the windows-native-build action.
        run: |
          $tag = (Get-Content -LiteralPath apps/slate-windows/uniffi-bindgen-cs.version -Raw).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+\+v\d+\.\d+\.\d+$') { throw "Malformed uniffi-bindgen-cs tag: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Cache uniffi-bindgen-cs
        id: bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ steps.bindgen-pin.outputs.tag }}-${{ runner.os }}-x64

      - name: Install uniffi-bindgen-cs
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        # Tag pinned to the workspace's uniffi minor (w0_spec §Decision
        # consequences: upgraded in lockstep with the uniffi dependency).
        # ~/.cargo/bin is deliberately NOT on the cache volume (the
        # rust.yml/taiki-e reasoning: never shadow the image toolchain),
        # so the binary keeps riding the GitHub cache, which Namespace
        # runners proxy.
        run: cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag '${{ steps.bindgen-pin.outputs.tag }}' uniffi-bindgen-cs --locked

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Record the .NET SDK
        # The pin is global.json at the repository root (#1568): every
        # dotnet here runs from the root, so it reads that file.
        run: |
          $pinned = (Get-Content -Raw global.json | ConvertFrom-Json).sdk.version
          $resolved = (dotnet --version).Trim()
          Write-Host "global.json pins $pinned; dotnet resolves $resolved"
          if ($resolved -ne $pinned) { throw "dotnet resolved SDK $resolved, not the pinned $pinned" }

      - name: Generate C# bindings (builds slate_uniffi x64 cdylib)
        run: ./apps/slate-windows/generate-bindings.ps1 -Locked

      - name: Build
        run: dotnet build apps/slate-windows/SlateWindows.slnx --configuration Release

      # WB-17 (#1376, #1386): contracts 34 and 35 carry tables their
      # generators write from the document and the Windows tree, generated
      # binding included — so the checks run here, after the binding exists
      # (the ubuntu windows-model job has none). A record moved above a
      # pointer, or a renamed symbol, fails the lane instead of drifting.
      - name: Set up Python (the reconciliation checks)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify contract 34's reconciliation tables are the generator's output
        run: python -I scripts/canvas_reconciliation.py --check
      - name: Verify contract 35's reconciliation tables are the generator's output
        run: python -I scripts/graph_reconciliation.py --check
      - name: Test that the reconciliation checks catch a stale pointer
        run: python -I -m unittest discover -v -s scripts/tests -p test_reconciliation_check_flags_a_stale_pointer.py

      # The Connections model (W6-2 PR B2, B2-8) runs in its own lane below.
      # An STA fact that times out without pumping has the runtime's
      # createdump write a full dump of the test process into the uploaded
      # results folder (StaThread.DumpDirectory, #1603, #1641). The run is
      # under the device-state guard (#1331): it fails if the suite wrote
      # the runner's %LOCALAPPDATA%\Slate, and keeps the suite's own exit
      # code otherwise. Facts tagged kind=benchmark hold wall-clock budgets
      # or run for tens of seconds, so they stay out of the gate and run by
      # hand on a quiet machine (#1323).
      # #1680: a focus-dependent fact fails when another process takes the
      # foreground from the test host mid-run (Namespace's image; the home
      # VMs' OneDrive window before #1355). The sampler logs every
      # foreground change through the Test step, read-only, into the
      # results folder this job uploads.
      - name: Start the foreground sampler (#1680)
        run: |
          $results = '${{ runner.temp }}\slate-app-results'
          New-Item -ItemType Directory -Force $results | Out-Null
          Start-Process pwsh -WindowStyle Hidden -ArgumentList @(
            '-NoProfile', '-File', 'scripts/windows/foreground-sampler.ps1',
            '-Out', "$results\foreground.log",
            '-StopFile', '${{ runner.temp }}\foreground.stop')

      - name: Test
        env:
          SLATE_STA_DUMP_DIR: '${{ runner.temp }}\slate-app-results'
        run: >-
          pwsh -NoProfile -File scripts/windows/guard-device-state.ps1 --
          dotnet test apps/slate-windows/tests/SlateWindows.Tests/SlateWindows.Tests.csproj
          --configuration Release --no-build
          --filter "FullyQualifiedName!~ConnectionsLeafTests.TheModelOf&kind!=benchmark"
          --logger "trx;LogFileName=slate-windows-app.trx"
          --results-directory "${{ runner.temp }}\slate-app-results"
          --blame-hang-timeout 10m --blame-hang-dump-type mini

      # #1331: the device-state guard both test steps run under, and the
      # field-pass launcher, are tested where they run: on Windows, through
      # `pwsh -NoProfile -File`. SLATE_REQUIRE_DEVICE_STATE_SCRIPT_TESTS
      # turns a skip (no pwsh) into a failure. The home image carries Python
      # 3.13 in the tool cache, so setup-python installs nothing there. They
      # run even when the unit Test step failed, so both results show.
      - name: Set up Python (device-state script tests)
        if: ${{ !cancelled() }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Test the device-state scripts
        if: ${{ !cancelled() }}
        env:
          SLATE_REQUIRE_DEVICE_STATE_SCRIPT_TESTS: '1'
        run: |
          python -I -m unittest discover -v -s scripts/tests -p test_guard_device_state.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m unittest discover -v -s scripts/tests -p test_launch_for_field_pass.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m unittest discover -v -s scripts/tests -p test_foreground_sampler.py

      - name: Stop the foreground sampler and show what held the foreground (#1680)
        if: ${{ always() }}
        run: |
          New-Item -ItemType File -Force '${{ runner.temp }}\foreground.stop' | Out-Null
          Start-Sleep -Seconds 3
          $log = '${{ runner.temp }}\slate-app-results\foreground.log'
          if (Test-Path $log) {
            Get-Content $log | Where-Object { $_ -match ' foreground pid=| sampler ' }
          } else {
            Write-Host '::warning::the foreground sampler wrote no log'
          }

      # Named by attempt too (#1641): "Re-run failed jobs" keeps its run id,
      # and its upload would otherwise replace the failed attempt's evidence.
      - name: Upload app test results and hang evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: slate-windows-app-results-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: '${{ runner.temp }}\slate-app-results\**\*'
          if-no-files-found: warn
          retention-days: 7

      # Handoff to the flaui job: the exe resolver walks relative from
      # the test assembly, so the download must recreate the exact bin
      # layout. upload-artifact stores paths relative to the least common
      # ancestor, which global.json (the SDK pin the job has no checkout
      # to read, #1568) makes the repository root; the job downloads to
      # the workspace root. Named by run id, not by attempt (#1643): a
      # rerun of only the failed shell gate downloads what this job built
      # in an earlier attempt (run 39873324510's attempt 2 did), within the
      # artifact's one-day retention; a rerun of this job replaces it
      # (overwrite) before its gate runs again.
      - name: Upload FlaUI gate binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: flaui-binaries-${{ github.run_id }}
          overwrite: true
          path: |
            global.json
            apps/slate-windows/src/SlateWindows/bin/Release/**/*
            apps/slate-windows/tests/SlateWindows.AccessibilityTests/bin/Release/**/*
            apps/slate-windows/tools/GridConformanceHost/bin/Release/**/*
          if-no-files-found: error
          retention-days: 1

      - name: Format gate (dotnet format --verify-no-changes)
        run: dotnet format apps/slate-windows/SlateWindows.slnx --verify-no-changes

      - name: Cache footprint report
        # See the rust-tests twin. This lineage additionally carries the
        # NuGet packages folder.
        if: ${{ always() }}
        run: |
          $root = $env:NSC_CACHE_PATH
          if (-not $root) {
            Write-Host "::error::NSC_CACHE_PATH missing - cache volume not mounted"
            exit 1
          }
          try {
            # Fail CLOSED (adversarial rounds 7-8): SilentlyContinue let
            # a failed root enumeration print the cold sentinel and an
            # unreadable child render as 0.00 GiB (System Volume
            # Information, observed live); Get-ChildItem on a FILE path
            # succeeds and would attest a plausible 0.00 GiB, so the
            # root must resolve as a DIRECTORY first - a mount or access
            # failure must never masquerade as a cold attestation.
            $rootItem = Get-Item -LiteralPath $root -Force -ErrorAction Stop
          } catch {
            Write-Host "::error::cannot resolve cache volume root ${root}: $_"
            exit 1
          }
          if (-not $rootItem.PSIsContainer) {
            Write-Host "::error::cache volume root $root is not a directory - attestation impossible"
            exit 1
          }
          try {
            $children = @(Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop)
          } catch {
            Write-Host "::error::cannot enumerate cache volume root ${root}: $_"
            exit 1
          }
          $metadata = @('System Volume Information', '$RECYCLE.BIN', 'containerscache', 'gitmirror', 'lost+found')
          $children = @($children | Where-Object { $metadata -notcontains $_.Name })
          if ($children.Count -eq 0) { "cache volume empty (cold mount)" }
          foreach ($child in $children) {
            try {
              $bytes = (Get-ChildItem -LiteralPath $child.FullName -Recurse -Force -ErrorAction Stop |
                Measure-Object Length -Sum).Sum
              '{0,8:N2} GiB  {1}' -f ([double]$bytes / 1GB), $child.Name
            } catch {
              Write-Host "::warning::cannot measure $($child.Name) - measurement incomplete, NOT cold"
            }
          }

  windows-model-shard:
    name: app model (windows x64, shard ${{ matrix.shard }})
    needs: [changes, route]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ (needs.route.outputs.attempt == github.run_attempt && ((matrix.shard == 0 && needs.route.outputs.model-0-pool == 'home') || (matrix.shard == 1 && needs.route.outputs.model-1-pool == 'home'))) && 'slate-win-model' || format('namespace-profile-winx64-fast{0};overrides.cache-tag=slate-windows-model', github.ref != 'refs/heads/main' && '-pr' || '') }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    # Preserve cold-build headroom; successful waits are completion-based.
    timeout-minutes: 90
    # Both runners receive private cache-volume forks and build the same
    # release/NuGet graph, so the existing lineage stays useful to either.
    # Results live outside the cache. Trusted-main/PR routing is unchanged.
    steps:
      - name: Record the runner
        env:
          ROUTER_ATTEMPT: ${{ needs.route.outputs.attempt }}
        run: Write-Host "runner=${{ runner.name }} environment=${{ runner.environment }} attempt=${{ github.run_attempt }} router-attempt=$env:ROUTER_ATTEMPT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The W6-1 reconciliation's ancestry gate (CanvasReconciliationCensus)
          # runs `git merge-base --is-ancestor` over the ledgered merge commits;
          # a depth-1 clone cannot answer it.
          fetch-depth: 0

      - name: Assert runner architecture matches the cache lineage
        # See the rust-tests twin for the rationale.
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            Write-Host "::error::runner arch is $($env:PROCESSOR_ARCHITECTURE), cache lineage expects AMD64 - profile platform changed in the dashboard? Update this guard and expect one cold rebuild."
            exit 1
          }

      # rust-toolchain.toml pins 1.99.1; rustup materializes it (plus the
      # x86_64-pc-windows-msvc host target) on the first cargo call.

      - name: Cache Rust build + NuGet packages (Namespace NVMe cache)
        if: ${{ !(needs.route.outputs.attempt == github.run_attempt && ((matrix.shard == 0 && needs.route.outputs.model-0-pool == 'home') || (matrix.shard == 1 && needs.route.outputs.model-1-pool == 'home'))) }}
        # `rust` mode as in the rust-tests lane (this lineage carries the
        # RELEASE graph the bindings build needs), plus the NuGet
        # global-packages folder as an explicit path — the action unions
        # `cache:` modes with `path:` entries (swift-tests.yml pattern;
        # spacectl has no nuget mode).
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9  # v1.7.0
        with:
          cache: rust
          path: |
            ~/.nuget/packages

      - name: Cache mount state (pre-build)
        # Bootstrap attestation (docs/runbooks/ci-cache-policy.md step 3): read BEFORE any build
        # repopulates the volume, so a cold mount is distinguishable
        # from a surviving stale generation. Measured at the VOLUME
        # ROOT (adversarial round 4: junction/symlink mount points make
        # per-directory sizing lie; NSC_CACHE_PATH holds the real
        # content for every cache mode).
        run: |
          $root = $env:NSC_CACHE_PATH
          if (-not $root) {
            Write-Host "::error::NSC_CACHE_PATH missing - cache volume not mounted"
            exit 1
          }
          try {
            # Fail CLOSED (adversarial rounds 7-8): SilentlyContinue let
            # a failed root enumeration print the cold sentinel and an
            # unreadable child render as 0.00 GiB (System Volume
            # Information, observed live); Get-ChildItem on a FILE path
            # succeeds and would attest a plausible 0.00 GiB, so the
            # root must resolve as a DIRECTORY first - a mount or access
            # failure must never masquerade as a cold attestation.
            $rootItem = Get-Item -LiteralPath $root -Force -ErrorAction Stop
          } catch {
            Write-Host "::error::cannot resolve cache volume root ${root}: $_"
            exit 1
          }
          if (-not $rootItem.PSIsContainer) {
            Write-Host "::error::cache volume root $root is not a directory - attestation impossible"
            exit 1
          }
          try {
            $children = @(Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop)
          } catch {
            Write-Host "::error::cannot enumerate cache volume root ${root}: $_"
            exit 1
          }
          $metadata = @('System Volume Information', '$RECYCLE.BIN', 'containerscache', 'gitmirror', 'lost+found')
          $children = @($children | Where-Object { $metadata -notcontains $_.Name })
          if ($children.Count -eq 0) { "cache volume empty (cold mount)" }
          foreach ($child in $children) {
            try {
              $bytes = (Get-ChildItem -LiteralPath $child.FullName -Recurse -Force -ErrorAction Stop |
                Measure-Object Length -Sum).Sum
              '{0,8:N2} GiB  {1}' -f ([double]$bytes / 1GB), $child.Name
            } catch {
              Write-Host "::warning::cannot measure $($child.Name) - measurement incomplete, NOT cold"
            }
          }

      - name: Read the pinned uniffi-bindgen-cs tag
        id: bindgen-pin
        # apps/slate-windows/uniffi-bindgen-cs.version is the repository's one
        # copy, shared with the windows-native-build action.
        run: |
          $tag = (Get-Content -LiteralPath apps/slate-windows/uniffi-bindgen-cs.version -Raw).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+\+v\d+\.\d+\.\d+$') { throw "Malformed uniffi-bindgen-cs tag: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Cache uniffi-bindgen-cs
        id: bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ steps.bindgen-pin.outputs.tag }}-${{ runner.os }}-x64

      - name: Install uniffi-bindgen-cs
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        # Tag pinned to the workspace's uniffi minor (w0_spec §Decision
        # consequences: upgraded in lockstep with the uniffi dependency).
        # ~/.cargo/bin is deliberately NOT on the cache volume (the
        # rust.yml/taiki-e reasoning: never shadow the image toolchain),
        # so the binary keeps riding the GitHub cache, which Namespace
        # runners proxy.
        run: cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag '${{ steps.bindgen-pin.outputs.tag }}' uniffi-bindgen-cs --locked

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Record the .NET SDK
        # The pin is global.json at the repository root (#1568): every
        # dotnet here runs from the root, so it reads that file.
        run: |
          $pinned = (Get-Content -Raw global.json | ConvertFrom-Json).sdk.version
          $resolved = (dotnet --version).Trim()
          Write-Host "global.json pins $pinned; dotnet resolves $resolved"
          if ($resolved -ne $pinned) { throw "dotnet resolved SDK $resolved, not the pinned $pinned" }

      - name: Generate C# bindings (builds slate_uniffi x64 cdylib)
        run: ./apps/slate-windows/generate-bindings.ps1 -Locked

      - name: Build
        run: dotnet build apps/slate-windows/SlateWindows.slnx --configuration Release

      # Partition reachable global ordinals, never the debug text filter.
      # Every shard still validates the complete inventory and exclusions.
      - name: Test (the Connections model)
        run: >-
          dotnet test apps/slate-windows/tests/SlateWindows.Tests/SlateWindows.Tests.csproj
          --configuration Release --no-build
          --filter "FullyQualifiedName~ConnectionsLeafTests.TheModelOf"
          --logger "trx;LogFileName=connections-model.trx"
          --results-directory "${{ runner.temp }}\slate-model-results"
          --blame-hang-timeout 45m --blame-hang-dump-type mini
        env:
          SLATE_MODEL_SHARD_INDEX: '${{ matrix.shard }}'
          SLATE_MODEL_SHARD_COUNT: '2'
          SLATE_MODEL_REPORT_DIR: '${{ runner.temp }}\slate-model-results'
          SLATE_MODEL_ONLY: ''

      - name: Upload model timings and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # Re-running only failed jobs retains successful sibling artifacts.
          # A rerun replaces this shard's evidence within the same run/SHA.
          name: windows-model-${{ github.run_id }}-${{ matrix.shard }}
          overwrite: true
          path: '${{ runner.temp }}\slate-model-results\**\*'
          if-no-files-found: error
          retention-days: 30

  windows-model:
    name: app model (windows x64)
    needs: [changes, windows-model-shard]
    if: ${{ always() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all model shards to succeed
        env:
          MODEL_RESULT: '${{ needs.windows-model-shard.result }}'
        run: |
          if [ "$MODEL_RESULT" != "success" ]; then
            echo "::error::model shards=$MODEL_RESULT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Test model coverage verifier
        run: python3 -m unittest discover -s scripts/tests -p test_windows_model_shards.py

      # W6-2 PR F (F7, IPJ-2-1): the committed parity matrix is the
      # generator's output for this tree — drift fails the lane.
      - name: Verify the parity matrix is the generator's output
        run: python3 scripts/generate-parity-matrix.py --check

      - name: Download every model shard report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: windows-model-${{ github.run_id }}-*
          path: '${{ runner.temp }}/slate-model-reports'

      - name: Verify complete model coverage and summarize timings
        run: >-
          python3 scripts/verify_windows_model_shards.py
          --reports-dir "${{ runner.temp }}/slate-model-reports"
          --shard-count 2 --summary "$GITHUB_STEP_SUMMARY"


  # W1-1 / §W-C: launch the real Fluent-styled WinExe on an interactive
  # desktop, drive UIA3 and run axe-windows using the app lane's binaries.
  flaui:
    name: shell accessibility gate (windows x64)
    needs: [changes, windows]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && needs.windows.result == 'success' }}
    runs-on: ${{ (vars.WINDOWS_RUNNER_MODE == 'home-only' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && !startsWith(github.head_ref || github.ref_name, 'dependabot/')) && 'slate-win-shell' || 'windows-latest' }}
    # Outside home-only mode the gate runs on windows-latest, where the
    # journeys took 12-18 minutes by October 2026 (WB-22's two find journeys
    # crossed the old 20). 35 is about twice a run: a hang still stops early.
    timeout-minutes: 35
    steps:
      # First, so setup-dotnet below reads the global.json the artifact
      # carries; the download itself needs no SDK.
      - name: Download FlaUI gate binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: flaui-binaries-${{ github.run_id }}
          path: .

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Record the .NET SDK
        # The pin is global.json at the repository root (#1568): every
        # dotnet here runs from the root, so it reads that file.
        run: |
          $pinned = (Get-Content -Raw global.json | ConvertFrom-Json).sdk.version
          $resolved = (dotnet --version).Trim()
          Write-Host "global.json pins $pinned; dotnet resolves $resolved"
          if ($resolved -ne $pinned) { throw "dotnet resolved SDK $resolved, not the pinned $pinned" }

      # Keep this process-owning gate separate from the in-process
      # censuses so the two test hosts cannot race for Slate's
      # single-instance identity. VSTest assembly mode: the adapters
      # ship in the bin folder, so no project file and no source are
      # needed on this runner; the one source file the artifact carries
      # is global.json, the SDK pin. The device-state guard (#1331)
      # travels in the artifact too, as tools\guard-device-state.ps1 in
      # the gate's output: it fails the run if a launch wrote the runner's
      # %LOCALAPPDATA%\Slate, waiting first for every SlateWindows.exe the
      # gate started to exit.
      - name: Shell accessibility gate (FlaUI + axe-windows)
        run: >-
          pwsh -NoProfile -File
          apps/slate-windows/tests/SlateWindows.AccessibilityTests/bin/Release/net10.0-windows/tools/guard-device-state.ps1 --
          dotnet test
          apps/slate-windows/tests/SlateWindows.AccessibilityTests/bin/Release/net10.0-windows/SlateWindows.AccessibilityTests.dll
          --logger "trx;LogFileName=slate-windows-accessibility.trx"
          --results-directory "${{ runner.temp }}\slate-accessibility-results"
          --blame-hang-timeout 5m --blame-hang-dump-type mini
        env:
          SLATE_REQUIRE_UI_AUTOMATION: '1'
          SLATE_ACCESSIBILITY_EVIDENCE_DIR: '${{ runner.temp }}\slate-accessibility-evidence'

      # Keep both the runner result and the per-surface axe summaries. This
      # runs after a failing gate as well so an accessibility regression leaves
      # actionable evidence instead of only an ephemeral console transcript.
      # Named by attempt too (#1648, as #1641 did for the app's results):
      # "Re-run failed jobs" would otherwise replace the failed attempt's
      # evidence; nothing downloads it by name.
      - name: Upload shell accessibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: slate-windows-accessibility-${{ github.sha }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            ${{ runner.temp }}\slate-accessibility-results\**\*
            ${{ runner.temp }}\slate-accessibility-evidence\**\*
          if-no-files-found: warn
          retention-days: 30

  # The historical required-check identity. Fails unless ALL lanes
  # succeed, so "build + test (windows x64)" green still means what it
  # meant when the lanes were one serial job. It evaluates the lane
  # results on a standard hosted runner without an attached paid cache.
  # The lane's path list above names only the plan documents the censuses read.
  # This proves the list is complete: every docs path the lane reads (in
  # the Windows sources, the trigger ledger's decisions, the AT navigation
  # map's links and the scripts this workflow runs) must start the lane, so
  # a docs-only change to one of them can never skip it. It stands on its
  # own: its red check is the signal, and the gate's needs stay as the
  # runner tests pin them (ci/windows-runner/tests/Workflows.Tests.ps1).
  docs-trigger:
    name: windows docs trigger census
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Test the docs trigger check
        run: python3 -m unittest discover -s scripts/tests -p test_windows_docs_trigger.py

      - name: Every docs path the lane reads starts the lane
        run: python3 scripts/check_windows_docs_trigger.py

  gate:
    name: build + test (windows x64)
    needs: [changes, route, rust-tests, windows, windows-model, flaui]
    # Skipped, and so passed, only when changes decided that the pull request
    # touches none of the lane's paths (#1565).
    if: ${{ always() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all windows lanes succeeded
        # The routing job's outputs are written by the pull request's own
        # route.py: they reach the script as data, never as expressions.
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          ROUTER_ATTEMPT: ${{ needs.route.outputs.attempt }}
          RUST_POOL: ${{ needs.route.outputs.rust-pool }}
          APP_POOL: ${{ needs.route.outputs.app-pool }}
          MODEL_0_POOL: ${{ needs.route.outputs.model-0-pool }}
          MODEL_1_POOL: ${{ needs.route.outputs.model-1-pool }}
        run: |
          if [ "${{ needs.rust-tests.result }}" != "success" ] || [ "${{ needs.windows.result }}" != "success" ] || [ "${{ needs.windows-model.result }}" != "success" ] || [ "${{ needs.flaui.result }}" != "success" ]; then
            echo "::error::rust-tests=${{ needs.rust-tests.result }} app=${{ needs.windows.result }} model=${{ needs.windows-model.result }} flaui=${{ needs.flaui.result }} route=$ROUTE_RESULT router-attempt='$ROUTER_ATTEMPT' attempt=${{ github.run_attempt }} pools: rust=$RUST_POOL app=$APP_POOL model-0=$MODEL_0_POOL model-1=$MODEL_1_POOL"
            exit 1
          fi
