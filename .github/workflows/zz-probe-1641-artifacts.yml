# Throwaway probe for #1644 (never merges): does "Re-run failed jobs" keep
# a failed attempt's artifact when its name carries the run attempt?
# Hosted Linux only. Attempt 1 uploads, then fails; attempt 2 uploads.

name: Probe 1641 artifacts

on:
  pull_request:

permissions: {}

jobs:
  evidence:
    name: upload by attempt, fail on the first
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the attempt
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: echo "attempt $ATTEMPT" > evidence.txt

      - name: Upload, named by attempt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: probe-1641-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: evidence.txt
          retention-days: 1

      - name: Fail the first attempt
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: test "$ATTEMPT" != 1
