# Tests for the self-hosted Windows runner's host-side code
# (ci/windows-runner/**): the orchestrator module, the GitHub and Hyper-V
# adapters (faked), the guest and golden scripts (parsed). Hosted Linux,
# no runner, VM or cache volume involved.
# docs/superpowers/specs/2026-10-10-self-hosted-windows-runner-design.md.

name: Windows runner tests

on:
  pull_request:
    paths:
      - 'ci/windows-runner/**'
      - '.github/workflows/windows-runner-tests.yml'
      # The Workflows guards must run when a routed workflow changes.
      - '.github/workflows/windows.yml'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/windows-ci-pilot.yml'
      # The branch-cleanup guard (Workflows.Tests.ps1) and behaviour test
      # (BranchCleanup.Tests.ps1) must run when that workflow or its script changes.
      - '.github/workflows/branch-cleanup.yml'
      - 'ci/branch-cleanup/**'
      # The PR gate's guard (Workflows.Tests.ps1) must run when it changes.
      - '.github/workflows/pr-gate.yml'
      # The Dependabot pause's guard (Workflows.Tests.ps1) must run when it changes.
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths:
      - 'ci/windows-runner/**'
      - '.github/workflows/windows-runner-tests.yml'
      # The Workflows guards must run when a routed workflow changes.
      - '.github/workflows/windows.yml'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/windows-ci-pilot.yml'
      # The branch-cleanup guard (Workflows.Tests.ps1) and behaviour test
      # (BranchCleanup.Tests.ps1) must run when that workflow or its script changes.
      - '.github/workflows/branch-cleanup.yml'
      - 'ci/branch-cleanup/**'
      # The PR gate's guard (Workflows.Tests.ps1) must run when it changes.
      - '.github/workflows/pr-gate.yml'
      # The Dependabot pause's guard (Workflows.Tests.ps1) must run when it changes.
      - '.github/dependabot.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: module, adapters, scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure Pester 5
        # Pinned to the newest 5.x on the gallery (Find-Module Pester
        # -AllVersions, 2026-10-10): an unpinned install takes whatever it
        # serves that day. Prints the Pester version, then the pwsh version.
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.9.1' })) {
            Install-Module Pester -RequiredVersion 5.9.1 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.9.1' } | Select-Object -First 1).Version.ToString()
          $PSVersionTable.PSVersion.ToString()

      - name: Run the suite
        # Each step is a new pwsh, so the pin is imported here; Invoke-Tests.ps1
        # keeps a Pester 5 that is already loaded.
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.9.1 -Force
          ./ci/windows-runner/tests/Invoke-Tests.ps1

      - name: Set up Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Run the router's tests
        # The Windows lane router (ci/windows-runner/route/route.py) is
        # Python, like the mac runner's; same discover shape as
        # mac-runner-tests.yml. Runs even when the Pester step failed, so
        # one red suite cannot hide the other.
        if: ${{ !cancelled() }}
        run: python -I -m unittest discover -v -s ci/windows-runner/route/tests -t ci/windows-runner/route
