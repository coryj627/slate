# Tests for the self-hosted Windows runner's host-side code
# (ci/windows-runner/**): the orchestrator module, the GitHub and Hyper-V
# adapters (faked), the guest and golden scripts (parsed). Hosted Linux,
# no runner, VM or cache volume involved.
# docs/superpowers/specs/2026-10-10-self-hosted-windows-runner-design.md.

name: Windows runner tests

on:
  pull_request:
    paths:
      - 'ci/windows-runner/**'
      - '.github/workflows/windows-runner-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ci/windows-runner/**'
      - '.github/workflows/windows-runner-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: module, adapters, scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Ensure Pester 5
        shell: pwsh
        run: |
          $have = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' }
          if (-not $have) { Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck }
          (Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1).Version.ToString()
          $PSVersionTable.PSVersion.ToString()

      - name: Run the suite
        shell: pwsh
        run: ./ci/windows-runner/tests/Invoke-Tests.ps1
