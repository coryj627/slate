# Swift tests for the Mac app.
#
# Runs the SlateMac XCTest target on every PR that touches the app's
# Swift sources or the Rust crates the app links against. The test
# target imports SlateMac which depends on the slate_uniffi dylib, so we
# need cargo build + uniffi-bindgen before `swift test`.
#
# Where it runs (docs/plans/42_self_hosted_mac_runner_plan.md §6): a short
# route job on hosted Linux picks the self-hosted Mac Studio runner
# (label slate-mac-tart) while its controller's heartbeat is fresh, and
# Namespace's Tahoe runner otherwise. The Studio job starts in the warm
# image's checkout of main with its build products, so it rebuilds only
# what the PR changed; Namespace starts cold.

name: Swift Tests

on:
  pull_request:
    paths:
      - 'apps/slate-mac/**'
      - 'crates/slate-uniffi/**'
      - 'crates/slate-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      # macOS rustflags (rustc stripping disabled) live here.
      - '.cargo/config.toml'
      - '.github/workflows/swift-tests.yml'
      - 'examples/swift-cli/**'
      # XCTest reads feature help and the shared accessibility corpus.
      - 'docs/help/**'
      - 'tests/fixtures/**'
      - 'scripts/build-mac-app.sh'
      - 'scripts/build-swift-cli.sh'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'apps/slate-mac/**'
      - 'crates/slate-uniffi/**'
      - 'crates/slate-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      # macOS rustflags (rustc stripping disabled) live here.
      - '.cargo/config.toml'
      - '.github/workflows/swift-tests.yml'
      - 'examples/swift-cli/**'
      - 'docs/help/**'
      - 'tests/fixtures/**'
      - 'scripts/build-mac-app.sh'
      - 'scripts/build-swift-cli.sh'
      - 'Makefile'

permissions:
  contents: read

# Superseded PR pushes cancel the in-flight run (macOS runner minutes are
# the expensive pool); runs on main never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Xcode build every mac runner must offer. The Studio image bakes this
  # one (ci/mac-runner/image/scripts/toolchain-xcode.sh); Namespace's image
  # carries several. Bump the workflow and the image together. The app's
  # SwiftUI bodies need a current Swift: 6.2.4 (Xcode 26.3) times out
  # type-checking MainSplitView.body.
  XCODE_BUILD: 27A266a

jobs:
  route:
    name: Route mac jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      label: ${{ steps.route.outputs.label }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - name: Checkout the route script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          sparse-checkout: ci/mac-runner/route
          persist-credentials: false
      - name: Pick the runner from MAC_RUNNER_MODE and the heartbeat
        id: route
        env:
          MAC_RUNNER_MODE: ${{ vars.MAC_RUNNER_MODE }}
          MAC_RUNNER_HEARTBEAT: ${{ vars.MAC_RUNNER_HEARTBEAT }}
        run: python3 ci/mac-runner/route/route.py

  swift-tests:
    name: Mac app XCTest suite
    needs: route
    # Same-repo heads only. Routing is not a security control (plan §6.1);
    # the workflow execution policy and the runner's admission hook are. This
    # keeps a fork PR, should one ever be approved, off the mac runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ needs.route.outputs.label }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          # On the Studio the workspace is the warm image's checkout of main
          # with target/ and apps/slate-mac/.build already built (plan §4.5);
          # a clean would delete them. Namespace starts empty, so clean is moot.
          clean: ${{ needs.route.outputs.route != 'studio' }}
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_BUILD }}
        run: |
          for app in /Applications/Xcode*.app; do
            build="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$app/Contents/version.plist" 2>/dev/null || true)"
            if [ "$build" = "$XCODE_BUILD" ]; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              echo "using $app ($build)"
              exit 0
            fi
          done
          echo "::error::no Xcode with build $XCODE_BUILD under /Applications; bump XCODE_BUILD together with the image"
          exit 1

      - name: Rust on PATH
        # Namespace's image keeps rustup under ~/.cargo/bin, off PATH in a
        # non-login shell; rustup then installs the rust-toolchain.toml pin on
        # first use. The Studio's runner has its toolchain on PATH already.
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; fi
          echo "route: ${{ needs.route.outputs.route }} ($(id -un) on $(hostname))"

      - name: Build slate-uniffi + generate Swift bindings + swift build
        # scripts/build-mac-app.sh runs:
        #   cargo build -p slate-uniffi
        #   uniffi-bindgen generate (Swift)
        #   stage bindings into apps/slate-mac/Sources/
        #   swift build inside apps/slate-mac/
        # `--skip-a11y-check` keeps a11y enforcement isolated to the
        # dedicated Accessibility Check workflow; a regression there
        # shouldn't also break this run.
        run: ./scripts/build-mac-app.sh --skip-a11y-check

      - name: Run swift test
        # --parallel: SwiftPM runs XCTest suites SERIALLY by default;
        # this fans test classes across worker processes. Gated on #935's
        # fix — worker processes start without NSApplication.shared, and
        # menu-dispatch tests must establish that precondition themselves
        # (AccessibleDataGridTests.setUp) instead of inheriting it from
        # suite order. Debug-config build products from the build script
        # step are reused; swift test only pays a planning pass.
        run: |
          cd apps/slate-mac
          DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/debug" swift test --parallel

      - name: Build + run swift-cli FFI smoke example
        # The swift-cli example shares the generated VaultError binding; its
        # `describe(_:)` switch is exhaustive, so a new VaultError variant
        # that isn't handled fails to compile. Building it here turns that
        # into a red CI run instead of a silently-rotting example (#390).
        run: make swift-cli
