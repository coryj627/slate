# cargo-audit configuration for the "Security audit" CI gate
# (.github/workflows/audit.yml). cargo-audit auto-discovers this file
# at .cargo/audit.toml relative to the workspace root.
#
# Policy: the gate fails on RustSec *vulnerabilities* and reports
# *unmaintained* crates as non-failing warnings. The `ignore` list
# below is for vulnerabilities we have consciously accepted because
# there is no available fix — each entry MUST have a tracking issue
# and a concrete removal condition. Do not add to this list to silence
# a fixable advisory; upgrade the dependency instead.
#
# Each active ignore MUST have a review-by date: CI (.github/workflows/audit.yml)
# fails once that date passes, or if it is absent. An accepted-risk exception
# must never become silent debt. There are currently no active exceptions.
# The quick-xml exceptions were removed by the immutable citationberg fix in
# Cargo.toml; downloaded or shared CSL styles are untrusted parser input.
# The temporary Git-source admission is NOT an advisory ignore: CI verifies
# citationberg rev 06a591e2f237d25e1dfdedac3f3d1494c496c52d and the effective
# quick-xml 0.41.0 graph. Provenance, offline packaging and the fixed-registry
# removal milestone: docs/runbooks/citation-dependency-policy.md (#480).

[advisories]
ignore = []
