<!-- @dsCard group="Components" viewport="700x250" name="Shell · Caption buttons, tab view" subtitle="CaptionButton (46 × 48: rest, hover, pressed, inactive) and TabView (open tab joins the content, close and add buttons)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shell</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);font:var(--type-body);overflow:hidden}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.k{font:var(--type-caption);color:var(--text-tertiary);width:84px;flex:none}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SlateDesignSystem_326dc9 || {};
class Safe extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?<span style={{font:"11px monospace",color:"var(--status-error)"}}>{this.props.n}: render error</span>:this.props.children}}
const C = ({n, ...p}) => { const X = NS[n]; return X ? <Safe n={n}><X {...p}/></Safe> : <span style={{font:"11px monospace",color:"var(--status-error)"}}>{n} missing</span>; };
const Row = ({k, children, style}) => <div className="row" style={style}><span className="k">{k}</span>{children}</div>;
function Tabs(){const [tabs,setTabs]=React.useState([{id:"a",label:"Linear algebra lecture 3",icon:"E8A5"},{id:"b",label:"Why Slate",icon:"E8A5"},{id:"c",label:"Reading list",icon:"E8A5"}]);const [v,setV]=React.useState("a");
return <div style={{width:620,border:"1px solid var(--border-subtle)",borderRadius:8,overflow:"hidden",background:"var(--surface-window)"}}><C n="TabView" tabs={tabs} value={v} onChange={setV} onClose={(id)=>setTabs(t=>t.filter(x=>x.id!==id))} onAdd={()=>{const id="n"+Date.now();setTabs(t=>[...t,{id,label:"Untitled",icon:"E8A5"}]);setV(id);}}/><div style={{height:44,background:"var(--surface-card)"}}/></div>}
function Demo(){return <div>
<Row k="Caption"><div style={{display:"flex",height:48,background:"var(--surface-window)",borderRadius:4}}><C n="CaptionButton" kind="minimize"/><C n="CaptionButton" kind="restore"/><C n="CaptionButton" kind="close"/></div>
<div style={{display:"flex",height:48,background:"var(--surface-window)",borderRadius:4}}><C n="CaptionButton" kind="minimize" state="hover"/><C n="CaptionButton" kind="maximize" state="pressed"/><C n="CaptionButton" kind="close" state="hover"/></div>
<div style={{display:"flex",height:48,background:"var(--surface-window)",borderRadius:4}}><C n="CaptionButton" kind="minimize" inactive/><C n="CaptionButton" kind="maximize" inactive/><C n="CaptionButton" kind="close" inactive/></div></Row>
<Row k="Tab view" style={{alignItems:"flex-start"}}><Tabs/></Row>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
