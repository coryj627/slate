<style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);overflow:hidden}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.k{font:12px/16px var(--font-ui);color:var(--text-tertiary);width:84px;flex:none;padding-top:6px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SlateDesignSystem_326dc9 || {};
class Safe extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?<span style={{font:"11px monospace",color:"var(--status-error)"}}>{this.props.n}: render error</span>:this.props.children}}
const C = ({n, ...p}) => { const X = NS[n]; return X ? <Safe n={n}><X {...p}/></Safe> : <span style={{font:"11px monospace",color:"var(--status-error)"}}>{n} missing</span>; };
const Row = ({k, children}) => <div className="row"><span className="k">{k}</span>{children}</div>;
/* Segoe Fluent Icons glyph (G-order rule: icon font first). */
const G = ({c, s=20}) => <span aria-hidden="true" style={{fontFamily:"var(--font-icons)",fontSize:s,lineHeight:s+"px",width:s,height:s,display:"inline-flex",alignItems:"center",justifyContent:"center",fontStyle:"normal"}}>{String.fromCharCode(parseInt(c,16))}</span>;
const ico = (c) => ({xOutline20:<G c={c}/>, xFilled20:<G c={c}/>, xOutline24:<G c={c} s={24}/>, xFilled24:<G c={c} s={24}/>, icon1:<G c={c}/>});
function Demo(){const ni={iconSelected:false,iconUnselected:false};return <div>
<Row k="Tabs"><C n="HorizontalTab" selected={true} text1="Editor" {...ni}/><C n="HorizontalTab" selected={false} text1="Reader" {...ni}/><C n="HorizontalTab" selected={false} text1="Outline" {...ni}/></Row>
<Row k="Tabs · circular"><C n="HorizontalTab" appearance="subtle circular" selected={true} text1="Links" {...ni}/><C n="HorizontalTab" appearance="subtle circular" selected={false} text1="Citations" {...ni}/></Row>
<Row k="Breadcrumb"><div style={{display:"flex",alignItems:"center"}}><C n="BreadcrumbItem" size="md" icon="off" label="demo-vault" divider={true}/><C n="BreadcrumbItem" size="md" icon="off" label="learning" divider={true}/><C n="BreadcrumbItem" size="md" icon="off" states="current" label="Linear algebra lecture 3" divider={false}/></div></Row>
<Row k="Nav"><div style={{width:240}}><C n="NavNodeMedium" content="Daily notes" selected={true} iconBeforeRegular={<G c="E787"/>} iconBeforeFilled={<G c="E787"/>} icon1={<G c="E787"/>}/><C n="NavNodeMedium" content="Projects" iconBeforeRegular={<G c="E8B7"/>} iconBeforeFilled={<G c="E8B7"/>} icon1={<G c="E8B7"/>}/></div><div style={{width:200}}><C n="VerticalTab" selected={true} text1="Properties" {...ni}/><C n="VerticalTab" selected={false} text1="Backlinks" {...ni}/></div></Row>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
