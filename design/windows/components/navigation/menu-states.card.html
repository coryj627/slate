<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);overflow:hidden}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.k{font:12px/16px var(--font-ui);color:var(--text-tertiary);width:84px;flex:none;padding-top:6px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SlateDesignSystem_326dc9 || {};
class Safe extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?<span style={{font:"11px monospace",color:"var(--status-error)"}}>{this.props.n}: render error</span>:this.props.children}}
const C = ({n, ...p}) => { const X = NS[n]; return X ? <Safe n={n}><X {...p}/></Safe> : <span style={{font:"11px monospace",color:"var(--status-error)"}}>{n} missing</span>; };
const Row = ({k, children}) => <div className="row"><span className="k">{k}</span>{children}</div>;
const G = ({c, s=20}) => <span aria-hidden="true" style={{fontFamily:"var(--font-icons)",fontSize:s,lineHeight:s+"px",width:s,height:s,display:"inline-flex",alignItems:"center",justifyContent:"center",fontStyle:"normal"}}>{String.fromCharCode(parseInt(c,16))}</span>;
const ROWS=[["Rest",{primaryString:"Find…",endContent:true,endContentString:"Ctrl+F"}],["Hover",{primaryString:"Toggle Reading Mode",endContent:true,endContentString:"Ctrl+Shift+E",state:"hover"}],["Keyboard focus",{primaryString:"Add Property…",focus:true}],["Pressed",{primaryString:"Citation Summary",endContent:true,endContentString:"Ctrl+Shift+J",state:"pressed"}],["Checked",{primaryString:"Check Spelling While Typing",selected:true}],["Unchecked",{primaryString:"Open Reading Links in New Tab"}],["Submenu",{primaryString:"Math",chevron:true}],["Disabled",{primaryString:"Jump to Bibliography",endContent:true,endContentString:"Ctrl+J",state:"disabled"}]];
const RULES=["One leading column. Once any row can be checked, every row keeps the 16 px check column, checked or not. In a menu with icons, the check takes the icon's place.","Shortcut and submenu chevron share the end column and take the row's colour, disabled included.","Keyboard focus is the 2 px ring on the rest fill. Hover and pressed change only the fill.","Disabled rows stay in place, and the arrow keys skip them.","Rows are 40 px apart. The highlight is 34 px high, inset 5 px from the menu edges, with radius 3 (WinUI).","WPF: give the submenu-header template the same icon column and padding as the item template."];
function Demo(){const base={icon:false,chevron:false,endContent:false,checkmark:true,selected:false,secondaryText:false,style:{width:304}};return <div style={{display:"flex",gap:20,alignItems:"flex-start"}}>
<div style={{display:"flex",gap:8}}><div style={{display:"flex",flexDirection:"column",paddingTop:3}}>{ROWS.map(([k])=><span key={k} className="k" style={{height:40,lineHeight:"40px",padding:0}}>{k}</span>)}</div>
<C n="MenuMenu">{ROWS.map(([k,p])=><C key={k} n="MenuItem" {...base} {...p}/>)}</C></div>
<ul style={{margin:0,padding:"4px 0 0 16px",width:206,font:"12px/16px var(--font-ui)",color:"var(--text-secondary)",display:"flex",flexDirection:"column",gap:8}}>{RULES.map(r=><li key={r} style={{textWrap:"pretty"}}>{r}</li>)}</ul>
</div>}
