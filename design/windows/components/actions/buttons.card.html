<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);overflow:hidden}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.k{font:12px/16px var(--font-ui);color:var(--text-tertiary);width:84px;flex:none;padding-top:6px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SlateDesignSystem_326dc9 || {};
class Safe extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?<span style={{font:"11px monospace",color:"var(--status-error)"}}>{this.props.n}: render error</span>:this.props.children}}
const C = ({n, ...p}) => { const X = NS[n]; return X ? <Safe n={n}><X {...p}/></Safe> : <span style={{font:"11px monospace",color:"var(--status-error)"}}>{n} missing</span>; };
const Row = ({k, children}) => <div className="row"><span className="k">{k}</span>{children}</div>;
/* Segoe Fluent Icons glyph (G-order rule: icon font first). */
const G = ({c, s=20}) => <span aria-hidden="true" style={{fontFamily:"var(--font-icons)",fontSize:s,lineHeight:s+"px",width:s,height:s,display:"inline-flex",alignItems:"center",justifyContent:"center",fontStyle:"normal"}}>{String.fromCharCode(parseInt(c,16))}</span>;
const ico = (c, s=20) => ({xOutline20:<G c={c} s={s}/>, xFilled20:<G c={c} s={s}/>, xOutline24:<G c={c} s={24}/>, xFilled24:<G c={c} s={24}/>, icon1:<G c={c} s={s}/>});
function Demo(){const st=[["primary","Save"],["secondary (default)","Cancel"],["outline","Outline"],["subtle","Subtle"],["transparent","Transparent"]];return <div>
<Row k="Appearance">{st.map(([s,l])=><C key={s} n="Button" style2={s} size="medium (default)" icon={false} label={l}/>)}</Row>
<Row k="Size"><C n="Button" appearance="primary" size="sm" icon={false} label="Small"/><C n="Button" appearance="primary" size="medium (default)" icon={false} label="Medium"/><C n="Button" appearance="primary" size="lg" icon={false} label="Large"/></Row>
<Row k="State"><C n="Button" appearance="primary" size="medium (default)" state="hover" icon={false} label="Hover"/><C n="Button" appearance="primary" size="medium (default)" state="pressed" icon={false} label="Pressed"/><C n="Button" appearance="secondary" size="medium (default)" state="disabled" icon={false} label="Disabled"/></Row>
<Row k="With icon"><C n="Button" appearance="primary" size="medium (default)" label="New note" {...ico("E710")}/><C n="Button" appearance="subtle" size="medium (default)" layout="icon only" {...ico("E713",16)}/><C n="Button" appearance="secondary" size="medium (default)" menuButton={true} icon={false} label="Sort"/></Row>
<Row k="Split · compound"><C n="SplitButton" appearance="primary" size="medium (default)" icon={false} label="New note"/><C n="CompoundButton" appearance="secondary" size="medium (default)" image={false} primaryString="Open vault" secondaryString="Choose a folder of notes"/></Row>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
