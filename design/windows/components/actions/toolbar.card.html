<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);overflow:hidden}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.k{font:12px/16px var(--font-ui);color:var(--text-tertiary);width:84px;flex:none;padding-top:6px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SlateDesignSystem_326dc9 || {};
class Safe extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?<span style={{font:"11px monospace",color:"var(--status-error)"}}>{this.props.n}: render error</span>:this.props.children}}
const C = ({n, ...p}) => { const X = NS[n]; return X ? <Safe n={n}><X {...p}/></Safe> : <span style={{font:"11px monospace",color:"var(--status-error)"}}>{n} missing</span>; };
const Row = ({k, children}) => <div className="row"><span className="k">{k}</span>{children}</div>;
/* Segoe Fluent Icons glyph (G-order rule: icon font first). */
const G = ({c, s=20}) => <span aria-hidden="true" style={{fontFamily:"var(--font-icons)",fontSize:s,lineHeight:s+"px",width:s,height:s,display:"inline-flex",alignItems:"center",justifyContent:"center",fontStyle:"normal"}}>{String.fromCharCode(parseInt(c,16))}</span>;
const ico = (c) => ({xOutline20:<G c={c}/>, xFilled20:<G c={c}/>, xOutline24:<G c={c} s={24}/>, xFilled24:<G c={c} s={24}/>, icon1:<G c={c}/>});
const IB=({c,label,pressed})=><button type="button" aria-label={label} title={label} aria-pressed={pressed} style={{width:32,height:32,border:0,borderRadius:4,background:pressed?"var(--surface-selected)":"transparent",color:pressed?"var(--accent-text)":"var(--text-primary)",display:"inline-flex",alignItems:"center",justifyContent:"center",cursor:"default"}}><G c={c} s={16}/></button>;const Sep=()=><span role="separator" style={{width:1,height:20,background:"var(--border-subtle)",margin:"0 4px"}}/>;
function Demo(){return <div>
<Row k="Static"><div style={{display:"flex",alignItems:"center",gap:2,padding:"4px 8px",height:40,boxSizing:"border-box",width:560,background:"var(--surface-raised)",border:"1px solid var(--border-subtle)",borderRadius:4}}>
<IB c="E8E7" label="Bold (Ctrl+B)"/><IB c="E8DB" label="Italic (Ctrl+I)"/><IB c="E8DD" label="Strikethrough"/><Sep/><IB c="E8FD" label="Bulleted list"/><IB c="E8FE" label="Numbered list"/><IB c="E8E2" label="Task list"/><Sep/><IB c="E71B" label="Insert link (Ctrl+K)"/><IB c="E943" label="Code block"/><IB c="E8B9" label="Insert image"/><span style={{flex:1}}/><C n="Button" appearance="subtle" size="small" icon={false} label="Reading" iconLabel={false}/><IB c="E712" label="More"/></div></Row>
<Row k="Contextual"><div style={{display:"inline-flex",alignItems:"center",gap:2,padding:4,background:"var(--surface-card)",border:"1px solid var(--border-subtle)",borderRadius:8,boxShadow:"var(--shadow-8)"}}><IB c="E8E7" label="Bold"/><IB c="E8DB" label="Italic"/><IB c="E71B" label="Link"/><Sep/><IB c="E8C8" label="Copy"/><IB c="E8EC" label="Add tag"/></div></Row>
<Row k="Kit frame"><div style={{transform:"scale(0.6)",transformOrigin:"top left",width:"166%",height:28}}><C n="Toolbar" size="sm" type="contextual (floating)" icon1={<G c="E8C8" s={16}/>} icon2={<G c="E71B" s={16}/>}/></div></Row>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
