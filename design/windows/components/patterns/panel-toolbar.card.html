<!-- @dsCard group="Components" viewport="700x380" name="Pattern · Panel tool row" subtitle="Title + count, search, sort menu (check column, Group by date toggle), collapse/expand all" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);overflow:hidden}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.k{font:12px/16px var(--font-ui);color:var(--text-tertiary);width:84px;flex:none;padding-top:6px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SlateDesignSystem_326dc9 || {};
class Safe extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?<span style={{font:"11px monospace",color:"var(--status-error)"}}>{this.props.n}: render error</span>:this.props.children}}
const C = ({n, ...p}) => { const X = NS[n]; return X ? <Safe n={n}><X {...p}/></Safe> : <span style={{font:"11px monospace",color:"var(--status-error)"}}>{n} missing</span>; };
const Row = ({k, children}) => <div className="row"><span className="k">{k}</span>{children}</div>;
const G = ({c, s=20}) => <span aria-hidden="true" style={{fontFamily:"var(--font-icons)",fontSize:s,lineHeight:s+"px",width:s,height:s,display:"inline-flex",alignItems:"center",justifyContent:"center",fontStyle:"normal"}}>{String.fromCharCode(parseInt(c,16))}</span>;
const LSORT=[{value:"name",label:"Note name"},{value:"mod",label:"Modified (newest first)"},{value:"count",label:"Mentions (most first)"}];
const SORT=[{value:"name-asc",label:"Name A to Z"},{value:"name-desc",label:"Name Z to A"},{value:"mod-new",label:"Modified (newest first)"},{value:"mod-old",label:"Modified (oldest first)"},{value:"cre-new",label:"Created (newest first)"},{value:"cre-old",label:"Created (oldest first)"}];
const Frame=({children})=><div style={{position:"relative",width:310,background:"var(--surface-window)",border:"1px solid var(--border-subtle)",borderRadius:4}}>{children}</div>;
const IB=({c,label})=>{const B=NS.Button;const g=<G c={c} s={16}/>;return <button aria-label={label} title={label} style={{padding:0,border:"none",background:"transparent",display:"flex",borderRadius:4,cursor:"pointer"}}>{B&&<B appearance="subtle" layout="icon only" size="medium" xOutline20={g} xFilled20={g} icon1={g}/>}</button>};
function Demo(){const [s,setS]=React.useState("name-asc");const [g,setG]=React.useState(false);const [e,setE]=React.useState(true);const [l,setL]=React.useState("name");
React.useEffect(()=>{const t=setTimeout(()=>{const b=document.querySelector('#files button[aria-haspopup="menu"]');if(b)b.dispatchEvent(new MouseEvent("click",{bubbles:true,detail:1}));},600);return()=>clearTimeout(t)},[]);
return <div style={{display:"flex",gap:20,minHeight:340}}>
<div style={{display:"flex",flexDirection:"column",gap:12}}>
<Frame><C n="PanelToolbar" title="Backlinks" count={3} sortOptions={LSORT} sortValue={l} onSortChange={setL} expanded={e} onExpandedChange={setE}/></Frame>
<Frame><C n="PanelToolbar" title="Backlinks" count={3} searchOpen={true} query="eigen" sortOptions={LSORT} sortValue={l} onSortChange={setL} expanded={e} onExpandedChange={setE}/></Frame>
<Frame><C n="PanelToolbar" title="Tags" count={12} expanded={false}/></Frame>
</div>
<div id="files"><Frame><C n="PanelToolbar" title="demo-vault" search={false} sortLabel="Sort and group" sortOptions={[...SORT,{separator:true},{label:"Group by date",checked:g,onSelect:()=>setG(!g)}]} sortValue={s} onSortChange={setS}><IB c="E710" label="New note (Ctrl+N)"/></C></Frame></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
