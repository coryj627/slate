<!-- @dsCard group="Components" viewport="700x210" name="Pattern · Note header" subtitle="Back/forward, breadcrumb, Source/Reading switch and the ⋯ menu; compact for narrow panes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);overflow:hidden}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.k{font:12px/16px var(--font-ui);color:var(--text-tertiary);width:84px;flex:none;padding-top:6px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SlateDesignSystem_326dc9 || {};
class Safe extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?<span style={{font:"11px monospace",color:"var(--status-error)"}}>{this.props.n}: render error</span>:this.props.children}}
const C = ({n, ...p}) => { const X = NS[n]; return X ? <Safe n={n}><X {...p}/></Safe> : <span style={{font:"11px monospace",color:"var(--status-error)"}}>{n} missing</span>; };
const Row = ({k, children}) => <div className="row"><span className="k">{k}</span>{children}</div>;
const G = ({c, s=20}) => <span aria-hidden="true" style={{fontFamily:"var(--font-icons)",fontSize:s,lineHeight:s+"px",width:s,height:s,display:"inline-flex",alignItems:"center",justifyContent:"center",fontStyle:"normal"}}>{String.fromCharCode(parseInt(c,16))}</span>;
const MORE=[{label:"Toggle Reading Mode",shortcut:"Ctrl+Shift+E"},{label:"Duplicate Tab",shortcut:"Ctrl+T"},{separator:true},{label:"Add Property…"},{label:"Bulk Rename Properties…",shortcut:"Ctrl+Shift+R"},{separator:true},{label:"Citation Summary",shortcut:"Ctrl+Shift+J"},{label:"Jump to Bibliography",shortcut:"Ctrl+J"},{separator:true},{label:"Pin Note"},{label:"Add to Shortcuts"},{separator:true},{label:"Close Tab",shortcut:"Ctrl+W"}];
const Frame=({children,w})=><div style={{width:w,border:"1px solid var(--border-subtle)",borderRadius:4}}>{children}</div>;
function Demo(){const [a,setA]=React.useState("reading");const [b,setB]=React.useState("source");const [c,setC]=React.useState("reading");const sc={mode:"Ctrl+Shift+E"};return <div>
<Row k="Reading"><Frame w={560}><C n="NoteHeader" path={["learning","Linear algebra lecture 3"]} canGoBack={true} mode={a} onModeChange={setA} shortcuts={sc} moreItems={MORE}/></Frame></Row>
<Row k="Source"><Frame w={560}><C n="NoteHeader" path={["reference","Code cookbook"]} canGoBack={true} canGoForward={true} mode={b} onModeChange={setB} shortcuts={sc} moreItems={MORE}/></Frame></Row>
<Row k="Compact"><Frame w={340}><C n="NoteHeader" path={["learning","Linear algebra lecture 3"]} mode={c} onModeChange={setC} compact={true} shortcuts={sc} moreItems={MORE}/></Frame></Row>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
