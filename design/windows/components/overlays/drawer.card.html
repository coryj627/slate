<!-- @dsCard group="Components" viewport="700x400" name="Drawer" subtitle="Inline drawer (right pane) and overlay drawer, composed from DrawerHeader, a body and DrawerFooter" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);overflow:hidden}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.k{font:12px/16px var(--font-ui);color:var(--text-tertiary);width:84px;flex:none;padding-top:6px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SlateDesignSystem_326dc9 || {};
class Safe extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?<span style={{font:"11px monospace",color:"var(--status-error)"}}>{this.props.n}: render error</span>:this.props.children}}
const C = ({n, ...p}) => { const X = NS[n]; return X ? <Safe n={n}><X {...p}/></Safe> : <span style={{font:"11px monospace",color:"var(--status-error)"}}>{n} missing</span>; };
const Row = ({k, children}) => <div className="row"><span className="k">{k}</span>{children}</div>;
/* Segoe Fluent Icons glyph (G-order rule: icon font first). */
const G = ({c, s=20}) => <span aria-hidden="true" style={{fontFamily:"var(--font-icons)",fontSize:s,lineHeight:s+"px",width:s,height:s,display:"inline-flex",alignItems:"center",justifyContent:"center",fontStyle:"normal"}}>{String.fromCharCode(parseInt(c,16))}</span>;
const ico = (c) => ({xOutline20:<G c={c}/>, xFilled20:<G c={c}/>, xOutline24:<G c={c} s={24}/>, xFilled24:<G c={c} s={24}/>, icon1:<G c={c}/>});
const Body=({rows})=><div style={{padding:"4px 8px",display:"flex",flexDirection:"column"}}>{rows.map(([ic,l,n])=><C key={l} n="CountListRow" icon={ic} label={l} count={n}/>)}</div>;
function Demo(){return <div style={{display:"flex",gap:24,alignItems:"flex-start"}}>
<div style={{width:300,height:360,display:"flex",flexDirection:"column",background:"var(--surface-card)",borderLeft:"1px solid var(--border-subtle)"}}>
<C n="DrawerHeader" title="Backlinks" dismiss={true} divider={false} leftActions={false} rightActions={false} style={{width:300}}/>
<div style={{flex:1,overflow:"hidden"}}><Body rows={[["E8A5","Linear algebra lecture 4",2],["E8A5","Linear algebra glossary",1],["E8A5","2026-05-27",1]]}/></div>
<C n="DrawerFooter" primaryLabel="Open all" secondaryLabel="Copy links" primaryButton={true} secondaryButton={true} moreButton={false} divider={true} style={{width:300}}/>
</div>
<div style={{position:"relative",width:340,height:360,background:"var(--scrim)",borderRadius:4,overflow:"hidden"}}>
<div style={{position:"absolute",top:0,right:0,bottom:0,width:280,display:"flex",flexDirection:"column",background:"var(--surface-card)",boxShadow:"var(--shadow-64)"}}>
<C n="DrawerHeader" title="Move To…" dismiss={true} divider={true} leftActions={false} rightActions={false} style={{width:280}}/>
<div style={{flex:1,padding:"8px 12px"}}><C n="SearchBox" appearance="outline" size="medium (default)" placeholder="Find a folder" style={{width:256}}/><div style={{height:8}}/><Body rows={[["E8B7","learning",12],["E8B7","reference",8],["E8B7","Archived",41]]}/></div>
<C n="DrawerFooter" primaryLabel="Move" secondaryLabel="Cancel" primaryButton={true} secondaryButton={true} moreButton={false} divider={true} style={{width:280}}/>
</div></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
