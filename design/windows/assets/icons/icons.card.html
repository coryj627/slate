<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(12,1fr);gap:14px 8px}.c{display:flex;flex-direction:column;align-items:center;gap:4px;font:10px/12px var(--font-ui);color:var(--text-tertiary);text-align:center}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Icon } = window.SlateDesignSystem_326dc9;
const n=["Search","Settings","Folder","Pin","Star","Info","Dismiss","MoreHorizontal","Navigation","Code","Filter","Clock","Delete","Image","Open","Lightbulb","BranchFork","ArrowSync","Calendar","Checkmark","Flag","Mail","Person","Chat","ArrowLeft","ArrowUp","ArrowDown","ArrowDownload","ArrowUpload","Warning","ErrorCircle","QuestionCircle","ClipboardTask","Play","Copilot","Glasses"];
const iconName=k=>k==="Calendar"?"CalendarDirectionLTRSize20Theme":k==="Folder"?"FolderSize20ItemCountNo":k+"Size20ThemeRegular";
ReactDOM.createRoot(document.getElementById('root')).render(<div className="g">{n.map(k=><div className="c" key={k}><Icon name={iconName(k)} size={20}/>{k}</div>)}</div>);
</script></body></html>
