<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-ui)}.sw{display:flex;gap:8px;flex-wrap:wrap}.s{width:76px;font:11px/14px var(--font-ui);color:var(--text-secondary)}.s i{display:block;height:48px;border-radius:4px;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.s b{display:block;color:var(--text-primary);font-weight:600}</style></head><body><div class="sw"><div class="s"><i style="background:#F7F7F7"></i><b>Window</b>#F7F7F7</div><div class="s"><i style="background:#FFFFFF"></i><b>Surface</b>#FFFFFF</div><div class="s"><i style="background:#EFEFEF"></i><b>Raised</b>#EFEFEF</div><div class="s"><i style="background:#767676"></i><b>Border</b>#767676</div><div class="s"><i style="background:#E0E0E0"></i><b>Subtle border</b>#E0E0E0</div><div class="s"><i style="background:#FDF5E1"></i><b>Selected</b>--surface-selected</div></div></body></html>
