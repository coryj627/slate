<!-- @dsCard group="Spacing" viewport="700x150" name="Focus & selection" subtitle="Keyboard focus is always visible; selection uses the gold indicator pill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-ui)}.sw{display:flex;gap:8px;flex-wrap:wrap}.s{width:76px;font:11px/14px var(--font-ui);color:var(--text-secondary)}.s i{display:block;height:48px;border-radius:4px;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.s b{display:block;color:var(--text-primary);font-weight:600}</style></head><body><div style="display:flex;gap:24px;align-items:center"><button style="font:14px/20px var(--font-ui);padding:5px 12px;border-radius:4px;border:1px solid var(--neutral-stroke-1-rest);background:var(--surface-card);outline:2px solid var(--text-primary);outline-offset:-2px;box-shadow:inset 0 0 0 3px #fff">Focused button</button><div style="position:relative;padding:6px 12px 6px 16px;border-radius:4px;background:var(--surface-hover);font-size:14px;width:180px"><span style="position:absolute;left:4px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent-indicator)"></span>Selected nav item</div><span style="background:var(--selection-bg);color:var(--selection-text);padding:2px 4px;font:14px var(--font-editor)">selected text</span></div></body></html>
