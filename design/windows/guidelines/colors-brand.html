<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-ui)}.sw{display:flex;gap:8px;flex-wrap:wrap}.s{width:76px;font:11px/14px var(--font-ui);color:var(--text-secondary)}.s i{display:block;height:48px;border-radius:4px;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.s b{display:block;color:var(--text-primary);font-weight:600}</style></head><body><div class="sw"><div class="s"><i style="background:#E2AD24"></i><b>Gold</b>--slate-gold</div><div class="s"><i style="background:#47515B"></i><b>Slate</b>--slate-grey</div><div class="s"><i style="background:#2F363D"></i><b>Slate dark</b>--slate-grey-dark</div><div class="s"><i style="background:#6B7681"></i><b>Slate light</b>--slate-grey-light</div></div></body></html>
