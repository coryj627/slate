<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-ui)}.sw{display:flex;gap:8px;flex-wrap:wrap}.s{width:76px;font:11px/14px var(--font-ui);color:var(--text-secondary)}.s i{display:block;height:48px;border-radius:4px;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.s b{display:block;color:var(--text-primary);font-weight:600}</style></head><body><div class="sw"><div class="s"><i style="background:var(--neutral-background-1-rest)"></i><b>Bg 1</b>background-1</div><div class="s"><i style="background:var(--neutral-background-2-rest)"></i><b>Bg 2</b>background-2</div><div class="s"><i style="background:var(--neutral-background-3-rest)"></i><b>Bg 3</b>background-3</div><div class="s"><i style="background:var(--neutral-foreground-1-rest)"></i><b>Fg 1</b>foreground-1</div><div class="s"><i style="background:var(--neutral-foreground-2-rest)"></i><b>Fg 2</b>foreground-2</div><div class="s"><i style="background:var(--neutral-foreground-3-rest)"></i><b>Fg 3</b>foreground-3</div><div class="s"><i style="background:var(--neutral-stroke-1-rest)"></i><b>Stroke 1</b>stroke-1</div><div class="s"><i style="background:var(--neutral-stroke-2-rest)"></i><b>Stroke 2</b>stroke-2</div></div></body></html>
